<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark" data-accent="aurora">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>پنل مدیریت | dmj74</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#060913">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='sans-serif' font-size='26' font-weight='800' fill='%2308061a' text-anchor='middle'%3Ed7%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/Vazirmatn-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <i class="bg__orb bg__orb--1"></i><i class="bg__orb bg__orb--2"></i><i class="bg__orb bg__orb--3"></i>
  </div>

  <!-- login -->
  <section class="auth" id="authView" hidden>
    <form class="auth__card card" id="loginForm">
      <span class="auth__mark"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg></span>
      <div>
        <h1 class="auth__title">پنل مدیریت</h1>
        <p class="muted small">برای ویرایش محتوای سایت وارد شو.</p>
      </div>
      <div class="auth__form">
        <div class="field"><label class="label" for="lgUser">یوزرنیم</label><input class="input" id="lgUser" autocomplete="username" required></div>
        <div class="field"><label class="label" for="lgPass">پسورد</label><input class="input" id="lgPass" type="password" autocomplete="current-password" required></div>
        <button class="btn btn--primary" type="submit" style="width:100%">ورود</button>
        <p class="auth__hint center">پیش‌فرض: <code>admin / admin123</code></p>
      </div>
    </form>
  </section>

  <!-- dashboard -->
  <div class="shell" id="shell" hidden>
    <aside class="side" id="side">
      <div class="side__brand">
        <span class="brand__mark">d7</span>
        <span><span class="brand__name">پنل مدیریت</span><br><span class="brand__sub">dmj74.ir</span></span>
      </div>
      <span class="side__label">محتوا</span>
      <nav id="sideNav" style="display:grid;gap:4px"></nav>
      <div class="side__foot">
        <a class="side__btn" href="index.html"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg> مشاهده سایت</a>
        <button class="side__btn" id="logoutBtn"><svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg> خروج</button>
      </div>
    </aside>
    <div class="side-scrim" id="scrim" hidden></div>

    <div class="main">
      <div class="main__bar">
        <div class="row">
          <button class="iconbtn" id="menuBtn" aria-label="منو"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
          <h1 class="main__title" id="mainTitle"></h1>
        </div>
        <div class="row">
          <span class="pill" id="syncPill"><i class="pill__dot"></i><span id="syncTxt">همگام‌سازی خاموش</span></span>
        </div>
      </div>
      <div class="main__in" id="panel"></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="splash" id="splash"><div class="splash__ring" role="status" aria-label="در حال بارگذاری"></div></div>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
