<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050409">
<title>۴۰۴ | titanali</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="robots" content="noindex">
<style>
:root{--txt:#fff;--mut:rgba(255,255,255,.6);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;
  color:var(--txt);background:#050409;min-height:100vh;display:grid;place-items:center;padding:26px 18px;
  line-height:1.9;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(760px 420px at 80% -10%,rgba(168,85,247,.22),transparent 60%),
             radial-gradient(680px 420px at 10% 10%,rgba(10,132,255,.2),transparent 60%)}
.card{position:relative;width:100%;max-width:430px;background:rgba(255,255,255,.08);border:1px solid var(--line);
  border-radius:24px;padding:26px 20px;text-align:center;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
.n{font-size:74px;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(135deg,#4da6ff,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:20px;margin:6px 0 8px}
p{color:var(--mut);font-size:14px}
a{display:inline-flex;align-items:center;gap:8px;margin-top:18px;text-decoration:none;color:#fff;font-weight:700;
  background:linear-gradient(135deg,#4da6ff,#0a84ff);border-radius:14px;padding:12px 20px;box-shadow:0 8px 22px rgba(10,132,255,.32)}
a.ghost{background:rgba(255,255,255,.1);border:1px solid var(--line);box-shadow:none}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<main class="card">
  <div class="n">۴۰۴</div>
  <h1>این صفحه در کارگاه پیدا نشد</h1>
  <p>ممکن است آدرس عوض شده باشد یا لینک اشتباه تایپ شده باشد.</p>
  <div class="row">
    <a href="./">→ بازگشت به صفحهٔ اصلی</a>
    <a class="ghost" href="./#gallery">مرور طرح‌ها</a>
  </div>
</main>
</body>
</html>
