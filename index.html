/* =====================================================================
   iOS 26 — Liquid Glass theme (به‌سبک iPhone) · dmj74
   ===================================================================== */
:root{
  --txt:#fff; --mut:rgba(255,255,255,.55);
  --glass:rgba(255,255,255,.08); --glass2:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.14);
  --blue:#0a84ff; --blue2:#4da6ff; --green:#30d158; --red:#ff453a;
  --orange:#ff9f0a; --pink:#ff375f; --purple:#a855f7; --yellow:#ffd60a;
  --r:22px; --shadow:0 12px 32px rgba(0,0,0,.4);
  /* legacy tokens (پنل مدیریت و کلاس‌های قدیمی) */
  --panel:rgba(255,255,255,.08); --elev:rgba(255,255,255,.06); --elev2:rgba(255,255,255,.12);
  --line2:rgba(255,255,255,.14); --dim:rgba(255,255,255,.55); --faint:rgba(255,255,255,.35);
  --c1:#4da6ff; --c2:#a855f7; --c3:#4da6ff; --bg:#050409;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;
  color:var(--txt);min-height:100vh;background:#050409;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.85;
}
button{font-family:inherit;cursor:pointer;color:inherit}
img{background:#101018;max-width:100%}
a{color:var(--blue2);text-decoration:none}
[hidden]{display:none!important}
::selection{background:rgba(10,132,255,.35)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}

/* ---------- پس‌زمینه ---------- */
.bg-cover{position:fixed;inset:0;background-size:cover;background-position:center;z-index:0;transition:opacity .4s}
.bg-scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(900px 500px at 85% -8%,rgba(168,85,247,.20),transparent 60%),
             radial-gradient(760px 460px at 10% 8%,rgba(10,132,255,.18),transparent 60%),
             radial-gradient(700px 520px at 50% 108%,rgba(255,55,95,.12),transparent 60%);}
.bg-scene .blob{display:none}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,5,12,.55),rgba(6,5,12,.86))}

/* ---------- نوار وضعیت آیفون ---------- */
.ios-statusbar{position:fixed;top:0;inset-inline:0;margin:auto;width:100%;max-width:430px;
  display:flex;justify-content:space-between;align-items:center;padding:13px 22px 8px;z-index:100;
  direction:ltr;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent);pointer-events:none}
.ios-statusbar #sbTime{font-size:15px;font-weight:600;min-width:56px;letter-spacing:.2px}
.sb-icons{display:flex;align-items:center;gap:6px;color:#fff}

/* ---------- قالب کلی ---------- */
#app{position:relative;z-index:1}
.shell{max-width:430px;margin:0 auto;min-height:100vh;position:relative}
.shell-body{position:relative}
.view{display:none}
.view.active{display:block;animation:viewIn .35s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view#view-home{padding-bottom:140px}
.ios-topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:56px 18px 14px}
.ios-brand-name{font-size:30px;font-weight:800;letter-spacing:.01em;line-height:1.2}
.ios-tagline{color:var(--mut);font-size:13px;margin-top:4px;max-width:32ch}
.ios-menu{width:46px;height:46px;flex:none;border-radius:50%;background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);
  display:grid;place-items:center;padding:0}
.ios-menu span{display:block;width:20px;height:2px;border-radius:2px;background:#fff;margin:2.5px auto;transition:.3s}
.ios-menu.on span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.ios-menu.on span:nth-child(2){opacity:0}
.ios-menu.on span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.ios-main{padding:4px 16px 0}

/* ---------- کارت شیشه‌ای ---------- */
.ios-card,.sec{background:var(--glass);backdrop-filter:blur(30px) saturate(1.5);
  -webkit-backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.sec{padding:16px}
.sec-title{font-size:16.5px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.sec-title::before{content:'';width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,var(--blue2),var(--purple))}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-head .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
.card-head b{font-size:15px}
.card-head .sp{margin-inline-start:auto;color:var(--mut);font-size:11.5px}

/* ---------- کارت پروفایل ---------- */
.hero{padding:22px 18px 18px;text-align:center}
.avatar{position:relative;width:104px;height:104px;margin:0 auto 14px}
.avatar-ring{position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 210deg,var(--blue2),var(--purple),var(--pink),var(--blue2));
  filter:blur(9px);opacity:.75;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar-img,.avatar-fallback{position:absolute;inset:0;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.2)}
.avatar-fallback{display:grid;place-items:center;font-size:34px;font-weight:800;
  background:linear-gradient(135deg,rgba(10,132,255,.35),rgba(168,85,247,.35));backdrop-filter:blur(10px)}
.avatar.no-img .avatar-img{display:none}
.avatar:not(.no-img) .avatar-img{display:block}
.avatar:not(.no-img) .avatar-fallback{display:none}
.hero-name{font-size:25px;font-weight:800}
.hero-role{color:var(--blue2);font-size:14px;margin-top:3px;font-weight:600}
.hero-loves{color:var(--mut);font-size:13px;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px}
.hero-loves .i{color:var(--blue2)}
.prose{color:rgba(255,255,255,.74);font-size:13.5px;line-height:2;white-space:pre-line}

/* ---------- ردیف‌های لیستی iOS ---------- */
.ios-list{display:flex;flex-direction:column}
.ios-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08);
  text-align:start;background:none;border-inline:0;border-top:0;width:100%;color:inherit}
.ios-row:last-child{border-bottom:0}
.ios-row:active{background:rgba(255,255,255,.07)}
.ios-row .ric{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;font-size:16px}
.ios-row .rmeta{flex:1;min-width:0}
.ios-row .rtitle{font-size:14.5px;font-weight:700}
.ios-row .rsub{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
.ios-row .rchev{color:var(--faint);font-size:18px;flex:none}
.sec .ios-row{padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.07)}

/* ---------- چیپ‌ها (مهارت / علاقه / تگ) ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
.chip.b{background:rgba(10,132,255,.16);border-color:rgba(10,132,255,.35);color:var(--blue2)}
.skill-group{margin-bottom:12px}
.skill-group:last-child{margin-bottom:0}
.skill-cat{font-size:13.5px;font-weight:700;color:rgba(255,255,255,.86);margin-bottom:7px}
.hobby-grid{display:flex;flex-wrap:wrap;gap:8px}
.hobby{display:inline-flex;align-items:center;gap:7px;background:var(--glass2);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}

/* ---------- کارت‌های پروژه / نمونه‌کار ---------- */
.proj-grid{display:flex;flex-direction:column;gap:12px}
.proj{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.proj-img{width:100%;height:170px;object-fit:cover;display:block}
.proj-body{padding:13px 14px}
.proj-title{font-size:15.5px;font-weight:800}
.proj-desc{color:rgba(255,255,255,.7);font-size:13px;margin-top:6px;line-height:1.9}
.proj-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);border-radius:999px;
  padding:3px 10px;font-size:11.5px;color:rgba(255,255,255,.8)}
.pf-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.pf-year{font-size:11.5px;color:var(--blue2);background:rgba(10,132,255,.14);border:1px solid rgba(10,132,255,.32);border-radius:999px;padding:3px 10px}
.proj-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pbtn{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff}
.pbtn:active{transform:scale(.97)}
.pbtn.primary{background:linear-gradient(135deg,var(--blue2),var(--blue));border-color:transparent;color:#fff;
  box-shadow:0 6px 18px rgba(10,132,255,.3)}

/* ---------- گالری ---------- */
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gitem{position:relative;border-radius:14px;overflow:hidden;background:#101018;border:1px solid var(--line);aspect-ratio:1}
.gitem img{width:100%;height:100%;object-fit:cover;display:block;transition:.25s}
.gitem:active img{transform:scale(1.05)}
.gitem .gcap{position:absolute;inset-inline:0;bottom:0;padding:20px 9px 7px;font-size:11px;color:#fff;
  background:linear-gradient(to top,rgba(0,0,0,.8),transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gallery-cta{display:flex;justify-content:center;margin-top:12px}
.ios-pill{display:inline-flex;align-items:center;gap:8px;background:var(--glass2);backdrop-filter:blur(20px);
  border:1px solid var(--line);color:#fff;border-radius:999px;padding:11px 18px;font-size:13.5px;font-weight:600}
.ios-pill:active{transform:scale(.97)}
.ios-cta{display:flex;justify-content:center;margin:2px 0 16px}

/* ---------- موسیقی ---------- */
.music-list{display:flex;flex-direction:column;gap:10px}
.track{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);
  border-radius:16px;padding:11px 13px}
.track.playing{border-color:rgba(10,132,255,.5);background:rgba(10,132,255,.1)}
.tr-ic{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff}
.tr-meta{flex:1;min-width:0}
.tr-title{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-artist{font-size:11.5px;color:var(--mut)}
.tr-btn{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;font-size:13px;padding:0}
.tr-seek{width:100%;accent-color:var(--blue);margin-top:6px;height:3px}

/* ---------- تماس‌ها ---------- */
.contact-grid{display:flex;flex-direction:column}
.contact{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.07);color:inherit}
.contact:last-child{border-bottom:0}
.contact:active{background:rgba(255,255,255,.06)}
.contact-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;font-size:16px}
.contact-meta{flex:1;min-width:0}
.contact-label{font-size:14.5px;font-weight:700}
.contact-id{font-size:12px;color:var(--mut);direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact-arrow{color:var(--faint);font-size:18px;flex:none}

/* ---------- داک پایین ---------- */
.ios-bottom{position:fixed;bottom:0;inset-inline:0;margin:auto;width:100%;max-width:430px;z-index:80;pointer-events:auto;
  padding:26px 14px 8px;background:linear-gradient(180deg,transparent,rgba(4,3,9,.78) 45%)}
.ios-dock{display:flex;justify-content:center;gap:30px;background:rgba(255,255,255,.14);
  backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
  border:1px solid rgba(255,255,255,.2);border-radius:32px;padding:13px 22px;margin-bottom:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.35)}
.app-ic{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0}
.app-ic .ic{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.35);transition:.15s}
.app-ic:active .ic{transform:scale(.9)}
.app-ic .ic.gal{background:linear-gradient(135deg,#ff9f0a,#ff375f)}
.app-ic .ic.cht{background:linear-gradient(135deg,#66e089,#25a852)}
.app-ic .ic.msc{background:linear-gradient(135deg,#a855f7,#0a84ff)}
.app-ic .ic.prj{background:linear-gradient(135deg,#a855f7,#0a84ff)}
.app-ic .ic.soc{background:linear-gradient(135deg,#4da6ff,#0a84ff)}
.app-ic .ic.gen{background:linear-gradient(135deg,#64748b,#3b4a63)}
/* soc-tile / gen-tile / sec-tile مشترک‌اند */
.app-ic .lbl{font-size:11px;color:#fff;opacity:.92;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-ic .badge{position:absolute;top:-4px;inset-inline-end:calc(50% - 30px)}
.badge{min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;
  display:grid;place-items:center;padding:0 5px}
.home-indicator{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.85);margin:4px auto 0}

/* ---------- منوی کشویی (drawer) ---------- */
.drawer-wrap{position:fixed;inset:0;z-index:120;visibility:hidden}
.drawer-wrap.open{visibility:visible}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:.25s}
.drawer-wrap.open .backdrop{opacity:1}
.drawer{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(84vw,330px);
  background:rgba(22,20,30,.95);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border-inline-start:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;
  padding:50px 14px 18px;gap:4px;transform:translateX(var(--dx,100%));
  transition:transform .28s var(--ease);overflow:auto}
html[dir=rtl] .drawer{--dx:-100%}
.drawer-wrap.open .drawer{transform:none}
.d-profile{display:flex;align-items:center;gap:11px;padding:10px 10px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}
.d-av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(10,132,255,.4),rgba(168,85,247,.4));font-weight:800}
.d-av img{width:100%;height:100%;object-fit:cover}
.d-pn{font-size:15px;font-weight:800}
.d-pr{font-size:12px;color:var(--mut)}
.d-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:14px;
  background:none;border:0;font-size:15px;text-align:start;color:#fff}
.d-item:active{background:rgba(255,255,255,.08)}
.d-ic{width:38px;height:38px;border-radius:11px;background:rgba(10,132,255,.14);color:var(--blue2);
  display:grid;place-items:center;flex:none}
.d-lab{flex:1}
.d-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);color:var(--mut);font-size:11.5px;text-align:center}

/* ---------- اپ پیام (iOS Messages) ---------- */
#view-chat,#view-gallery,#view-music,#view-projects,#view-social{padding-bottom:140px}
.ios-appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:6px;padding:50px 12px 10px;
  background:rgba(10,9,16,.82);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-bottom:1px solid rgba(255,255,255,.12)}
.ios-back{width:38px;height:38px;flex:none;border-radius:50%;background:none;border:0;color:var(--blue);display:grid;place-items:center}
.ios-appbar-mid{flex:1;min-width:0;text-align:center}
.ios-appbar-title{font-size:17px;font-weight:700}
.ios-appbar-sub{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(48,209,88,.18);display:inline-block}
.ios-appbar-sp{width:38px;flex:none}
.chat-hero{padding:22px 18px;text-align:center}
.chat-hero .big{width:74px;height:74px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--green),#0f9b4a);box-shadow:0 10px 26px rgba(37,168,82,.35)}
.chat-note{background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.2);border-radius:16px;
  padding:12px 14px;font-size:13px;color:rgba(255,255,255,.75);margin:0 16px 14px}
.ios-composer{padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
.c-row{display:flex;gap:8px;align-items:flex-end}
.c-row input,.c-row textarea{flex:1;min-width:0;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
  border-radius:20px;padding:12px 15px;color:#fff;font-size:14px;outline:none;font-family:inherit;resize:none}
.c-row input:focus,.c-row textarea:focus{border-color:var(--blue)}
.c-send{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--blue);color:#fff;
  display:grid;place-items:center;font-size:17px;padding:0;box-shadow:0 6px 16px rgba(10,132,255,.35)}
.c-send:active{transform:scale(.92)}
.msg-form{display:flex;flex-direction:column;gap:9px;width:100%}
.form-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- تب گالری (دسته‌بندی + لایت‌باکس) ---------- */
.gal-tabs{display:flex;gap:8px;padding:2px 16px 14px;overflow-x:auto;scrollbar-width:none}
.gal-tabs::-webkit-scrollbar{display:none}
.gal-tab{flex:none;background:var(--glass);border:1px solid var(--line);color:var(--mut);
  border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;transition:.2s}
.gal-tab.on{background:linear-gradient(135deg,var(--blue2),var(--blue));border-color:transparent;color:#fff}
.gitem.wide{grid-column:span 2;aspect-ratio:2/1}
.lb{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);display:grid;
  grid-template-rows:1fr auto;opacity:0;pointer-events:none;transition:.25s var(--ease)}
.lb.open{opacity:1;pointer-events:auto}
.lb-stage{display:grid;place-items:center;padding:16px;min-height:0}
.lb-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);transition:transform .25s var(--ease)}
.lb-bar{display:flex;align-items:center;gap:10px;padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  max-width:430px;margin:0 auto;width:100%}
.lb-cap{flex:1;min-width:0;font-size:13px;color:rgba(255,255,255,.85);text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-idx{font-size:12px;color:var(--mut);direction:ltr}
.lb-btn{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;font-size:16px;padding:0}

/* ---------- پخش‌کننده‌ی موسیقی ---------- */
.np{background:linear-gradient(160deg,rgba(168,85,247,.22),rgba(10,132,255,.14));
  border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 16px 14px;
  backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5)}
.np-top{display:flex;gap:12px;align-items:center}
.np-art{width:62px;height:62px;border-radius:16px;flex:none;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(135deg,var(--orange),var(--pink));box-shadow:0 8px 20px rgba(255,55,95,.25)}
.np-meta{flex:1;min-width:0}
.np-title{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-artist{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-ctrl{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:12px}
.np-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.08);
  color:#fff;display:grid;place-items:center;font-size:15px;padding:0}
.np-btn.big{width:58px;height:58px;font-size:20px;background:linear-gradient(135deg,var(--blue2),var(--blue));
  border-color:transparent;box-shadow:0 8px 22px rgba(10,132,255,.35)}
.np-time{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);direction:ltr;margin-top:4px}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;background:var(--blue2);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.demo-note{font-size:11px;color:var(--yellow);margin-top:8px;text-align:center}

/* ---------- حباب‌های گفتگو ---------- */
.chat-log{display:flex;flex-direction:column;gap:9px;padding:14px 16px 4px}
.bubble{max-width:78%;padding:10px 14px;border-radius:19px;font-size:13.5px;line-height:1.85;
  word-break:break-word;animation:bubbleIn .3s var(--ease)}
@keyframes bubbleIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.bubble.them{align-self:flex-start;background:rgba(255,255,255,.11);border:1px solid var(--line);
  border-start-start-radius:6px}
.bubble.me{align-self:flex-end;background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;
  border-end-end-radius:6px}
.b-when{display:block;font-size:10px;opacity:.6;margin-top:4px;direction:ltr}
.chat-empty{text-align:center;color:var(--mut);font-size:13px;padding:22px 16px}
.q-replies{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 10px}

/* ---------- کاشی‌های اشتراک‌شده (soc-tile / gen-tile / sec-tile) ---------- */
.tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px 14px}
.soc-tile,.gen-tile,.sec-tile{display:flex;flex-direction:column;align-items:center;gap:8px;
  background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px 10px;
  text-align:center;color:#fff;transition:.18s var(--ease)}
.soc-tile:active,.gen-tile:active,.sec-tile:active{transform:scale(.96);background:var(--glass2)}
.soc-tile .tic,.gen-tile .tic,.sec-tile .tic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  font-size:19px;color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.3)}
.soc-tile .tl,.gen-tile .tl,.sec-tile .tl{font-size:13px;font-weight:700}
.soc-tile .ts,.gen-tile .ts,.sec-tile .ts{font-size:11px;color:var(--mut);direction:ltr;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- آمار / نوار مهارت ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:11px 8px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:800;line-height:1.4}
.stat span{font-size:11px;color:var(--mut)}
.skill{margin-bottom:10px}
.skill:last-child{margin-bottom:0}
.skill-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:5px}
.skill-top em{font-style:normal;color:var(--mut);font-size:11.5px;direction:ltr}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue2),var(--purple));
  width:var(--w,0);transition:width .8s var(--ease)}

/* ---------- اعلان‌ها و میان‌بُر ---------- */
.toast{position:fixed;bottom:118px;inset-inline:0;margin:auto;width:max-content;max-width:88vw;z-index:300;
  background:rgba(28,26,38,.94);border:1px solid var(--line);border-radius:999px;padding:11px 20px;
  font-size:13px;font-weight:600;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);opacity:0;transform:translateY(12px);transition:.25s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:none}
.empty{padding:26px 16px;text-align:center;color:var(--mut);font-size:13px}
.hr{height:1px;background:var(--line);margin:12px 0}

/* ---------- پنل مدیریت (سردر پایین iOS) ---------- */
.adm-wrap{position:fixed;inset:0;z-index:220;visibility:hidden}
.adm-wrap.open{visibility:visible}
.adm{position:absolute;inset-inline:0;bottom:0;max-width:430px;margin:0 auto;max-height:92vh;display:flex;flex-direction:column;
  background:rgba(16,14,24,.97);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;transform:translateY(101%);
  transition:transform .32s var(--ease)}
.adm-wrap.open .adm{transform:none}
.adm-grab{width:42px;height:4px;border-radius:2px;background:rgba(255,255,255,.28);margin:9px auto 0}
.adm-head{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.adm-head b{font-size:16px}
.adm-x{margin-inline-start:auto;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.12);
  color:#fff;display:grid;place-items:center;font-size:14px;padding:0}
.adm-tabs{display:flex;gap:7px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.adm-tabs::-webkit-scrollbar{display:none}
.adm-tab{flex:none;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--mut);
  border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700}
.adm-tab.on{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;border-color:transparent}
.adm-body{padding:14px 16px 8px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.adm-pane{display:none;flex-direction:column;gap:10px}
.adm-pane.on{display:flex}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:12px;color:var(--mut);font-weight:700}
.adm input,.adm textarea,.adm select{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;color:#fff;font-size:13px;font-family:inherit;outline:none}
.adm textarea{min-height:150px;line-height:1.7;direction:ltr;text-align:start;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.adm input:focus,.adm textarea:focus{border-color:var(--blue);background:rgba(10,132,255,.08)}
.adm-foot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line)}
.adm-foot .pbtn{flex:1;justify-content:center;min-width:110px}
.hint{font-size:11.5px;color:var(--mut);line-height:1.8}
.kbd{display:inline-block;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:6px;
  padding:1px 6px;font-size:11px;direction:ltr}

/* ---------- انیمیشن ورود کارت‌ها ---------- */
.view.active .sec,.view.active .np,.view.active .stat{animation:secIn .5s var(--ease) both}
.view.active .sec:nth-child(2){animation-delay:.05s}
.view.active .sec:nth-child(3){animation-delay:.1s}
.view.active .sec:nth-child(4){animation-delay:.15s}
.view.active .sec:nth-child(5){animation-delay:.2s}
.view.active .sec:nth-child(6){animation-delay:.25s}
@keyframes secIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- انگلیسی / چپ‌به‌راست ---------- */
html[dir=ltr] body{line-height:1.7}
html[data-lang=en] .hero-name{letter-spacing:.01em}
html[data-lang=en] .ios-brand-name{letter-spacing:-.02em}

/* ---------- دسکتاپ: قاب گوشی ---------- */
@media (min-width:760px){
  body{display:grid;place-items:center;padding:26px 0}
  #app{width:100%;display:flex;justify-content:center}
  .shell{height:min(880px,92vh);overflow-y:auto;overflow-x:hidden;border-radius:46px;
    border:1px solid rgba(255,255,255,.12);background:rgba(6,5,12,.6);scrollbar-width:none;
    box-shadow:0 40px 90px rgba(0,0,0,.6),inset 0 0 0 9px rgba(255,255,255,.05),0 0 0 1px rgba(0,0,0,.6)}
  .shell::-webkit-scrollbar{display:none}
  .ios-statusbar,.ios-bottom{position:sticky;max-width:none;width:auto;margin:0}
  .ios-statusbar{top:0;z-index:60;background:rgba(6,5,12,.86);padding-bottom:10px;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.07)}
  .ios-appbar{top:37px}
  .ios-topbar{padding-top:22px}
  .ios-bottom{bottom:0;padding:16px 14px 10px;
    background:linear-gradient(180deg,rgba(5,4,10,0),rgba(5,4,10,.84) 42%)}
  .lb,.adm-wrap,.toast{position:fixed}
}
@media (max-width:340px){.ios-dock{gap:18px;padding:12px 14px}.app-ic .ic{width:50px;height:50px}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  html{scroll-behavior:auto}
}

/* ---------- موسیقی: فایل واقعی یا پیش‌نمایشِ ملودی ---------- */
var AU=new Audio(), P={i:-1,on:false,pos:0,dur:0,timer:null,ac:null,notes:[],osc:null};
function toSec(s){var m=String(s||'0:00').split(':');return (Number(m[0])||0)*60+(Number(m[1])||0)}
function fmt(s){s=Math.max(0,Math.floor(s||0));var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x}
function realTrack(tr){return !!(tr&&tr.src)}
function renderMusic(){
  $('#musCount').textContent=num(D.tracks.length)+' '+t('views');
  $('#trackList').innerHTML=D.tracks.map(function(tr,i){
    return '<div class="track'+(P.i===i&&P.on?' playing':'')+'" data-tr="'+i+'">'+
      '<span class="tr-ic">'+(P.i===i&&P.on?'<span class="eq"><i></i><i></i><i></i><i></i></span>':'♫')+'</span>'+
      '<span class="tr-meta"><span class="tr-title">'+esc(tr.title)+'</span>'+
      '<span class="tr-artist">'+esc(tr.artist||'')+' · '+esc(fmt(realTrack(tr)?P.dur:toSec(tr.dur)))+'</span></span>'+
      '<button class="tr-btn" data-trplay="'+i+'" aria-label="'+t('play')+'">'+(P.i===i&&P.on?'❚❚':'▶')+'</button></div>'}).join('')||
      '<div class="empty">—</div>';
  renderNP();
}
function renderNP(){
  var tr=D.tracks[P.i];
  if(!tr){$('#nowPlaying').innerHTML='<div class="empty">یک ترک را انتخاب کنید 🎵</div>';return}
  var pct=P.dur?Math.min(100,(P.pos/P.dur)*100):0;
  $('#nowPlaying').innerHTML=
    '<div class="np-top"><span class="np-art">'+(P.on?'🎼':'🎧')+'</span>'+
    '<span class="np-meta"><span class="np-title">'+esc(tr.title)+'</span>'+
    '<span class="np-artist">'+esc(tr.artist||'')+'</span></span></div>'+
    '<input class="tr-seek" type="range" min="0" max="'+Math.round(P.dur||1)+'" step="1" value="'+Math.round(P.pos)+'" id="npSeek" aria-label="جستجو">'+
    '<div class="np-time"><span>'+fmt(P.pos)+'</span><span>'+fmt(P.dur)+'</span></div>'+
    '<div class="np-ctrl"><button class="np-btn" data-trprev aria-label="قبلی">⏮</button>'+
    '<button class="np-btn big" data-trtoggle aria-label="'+(P.on?t('pause'):t('play'))+'">'+(P.on?'❚❚':'▶')+'</button>'+
    '<button class="np-btn" data-trnext aria-label="بعدی">⏭</button></div>'+
    (realTrack(tr)?'':'<div class="demo-note">◈ '+t('demo')+'</div>');
  void pct;
}
function pick(i,autoplay){
  if(i<0||i>=D.tracks.length)return;
  var tr=D.tracks[i], wasReal=P.i===i&&realTrack(tr);
  stopAll(); P.i=i; P.dur=toSec(tr.dur); P.pos=0;
  if(realTrack(tr)&&!wasReal){AU.src=tr.src; AU.load()}
  if(autoplay)start();
  renderMusic();
}
function start(){
  var tr=D.tracks[P.i]; if(!tr)return;
  P.on=true;
  if(realTrack(tr)){AU.play().catch(function(){toast('پخش فایل صوتی ممکن نشد')});}
  else synth(tr);
  P.timer=setInterval(function(){
    P.pos+=0.25;
    if(P.pos>=P.dur){next()}
    else {syncTime()}
  },250);
  renderMusic();
}
function stopAll(){
  P.on=false; clearInterval(P.timer); P.timer=null;
  if(!AU.paused)AU.pause();
  if(P.osc){try{P.osc.stop()}catch(e){}P.osc=null}
}
function toggle(i){
  if(P.i!==i){pick(i,true);return}
  if(P.on){stopAll();renderMusic()}else start();
}
function next(){pick((P.i+1)%D.tracks.length,true)}
function prev(){pick((P.i-1+D.tracks.length)%D.tracks.length,true)}
function syncTime(){
  if(P.i<0)return;
  var s=$('#npSeek'); if(s){s.value=Math.round(P.pos); s.max=Math.max(1,Math.round(P.dur))}
  var tt=$$('.np-time span'); if(tt.length===2){tt[0].textContent=fmt(P.pos);tt[1].textContent=fmt(P.dur)}
}
AU.addEventListener('timeupdate',function(){if(realTrack(D.tracks[P.i])){P.pos=AU.currentTime;P.dur=AU.duration||P.dur;syncTime()}});
AU.addEventListener('ended',function(){next()});
/* ملایم‌سازِ بی‌صدا (WebAudio) برای ترک‌هایی که فایل ندارند */
function synth(tr){
  try{
    P.ac=P.ac||new (window.AudioContext||window.webkitAudioContext)();
    var g=P.ac.createGain(); g.gain.value=0.0001; g.connect(P.ac.destination);
    var root=[196,220,246.94,261.63,293.66][D.tracks.indexOf(tr)%5]||220;
    var penta=[0,3,5,7,10];
    var step=0, master=P.ac.createGain(); master.gain.value=0.22; master.connect(g);
    g.gain.setTargetAtTime(1,P.ac.currentTime,0.4);
    P.osc={stop:function(){clearInterval(P.noteTimer);try{master.disconnect()}catch(e){}}};
    P.noteTimer=setInterval(function(){
      if(!P.on){clearInterval(P.noteTimer);return}
      var f=root*Math.pow(2,(penta[step%5]+(step%10>=5?12:0))/12); step++;
      var o=P.ac.createOscillator(), e=P.ac.createGain();
      o.type=step%3?'sine':'triangle'; o.frequency.value=f;
      e.gain.setValueAtTime(0.0001,P.ac.currentTime);
      e.gain.exponentialRampToValueAtTime(0.5,P.ac.currentTime+0.02);
      e.gain.exponentialRampToValueAtTime(0.0001,P.ac.currentTime+0.55);
      o.connect(e); e.connect(master); o.start(); o.stop(P.ac.currentTime+0.6);
    },320);
  }catch(e){/* مرورگر قدیمی: فقط نوار زمان کار می‌کند */}
}

function copy(txt,msg){

  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback)}
  else fallback();
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');done()}catch(e){toast(txt)}
    document.body.removeChild(ta);
  }
}

    drawer(false);
    var a=act.dataset.act;
    if(a==='lang'){D.settings.lang=L()==='fa'?'en':'fa';save();renderAll();toast(D.settings.lang==='fa'?'فارسی':'English')}
    if(a==='bg'){adm(true);admTab='settings';renderAdmin()}
    if(a==='share')share();
    if(a==='admin'){adm(true)}
    return;
  }
  var gt=near('[data-gal]'); if(gt){galFilter=gt.dataset.gal;renderGallery();return}
  var pt=near('[data-prj]'); if(pt){prjStatus=pt.dataset.prj;renderProjects();return}
  var gi=near('.gitem[data-lb]'); if(gi){openLB(Number(gi.dataset.lb));return}
  if(near('#lbPrev')){stepLB(-1);return}
  if(near('#lbNext')){stepLB(1);return}
  if(el&&el.id==='lightbox'){closeLB();return}

  var tp=near('[data-trplay]'); if(tp){toggle(Number(tp.dataset.trplay));return}
  if(near('[data-trtoggle]')){if(P.i<0)pick(0,true);else toggle(P.i);return}
  if(near('[data-trnext]')){next();return}
  if(near('[data-trprev]')){prev();return}

  var q=near('[data-q]'); if(q){var ta=$('#chatText');ta.value=q.dataset.q;ta.focus();return}
  var sh=near('[data-share]'); if(sh){sendVia(sh.dataset.share);return}
  if(near('#btnChatClear')){D.messages=[];save();renderChat();toast(isFa()?'گفتگو پاک شد':'Chat cleared');return}
  if(near('#btnShare')){share();return}
  if(near('#btnCopyMail')){
    var m=D.contacts.filter(function(c){return c.kind==='email'})[0];
    if(m)copy(m.id);else toast('ایمیلی ثبت نشده');
    return;
  }
  var cp=near('[data-copy]');
  if(cp){e.preventDefault();copy(cp.dataset.copy);return}

  var at=near('[data-adm-tab]'); if(at){admTab=at.dataset.admTab;renderAdmin();return}
  if(near('#admSave')){admSave();return}
  if(near('#admExport')){admExport();return}
  if(near('#admImport')){$('#admFile').click();return}
  if(near('#admReset')){admReset();return}
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='npSeek'){
    var v=Number(e.target.value)||0; P.pos=v;
    if(realTrack(D.tracks[P.i])){try{AU.currentTime=v}catch(err){}}
    syncTime();
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if($('#lightbox').classList.contains('open'))closeLB();else if($('#adminPanel').classList.contains('open'))adm(false);else drawer(false)}
  if($('#lightbox').classList.contains('open')){
    if(e.key==='ArrowLeft')stepLB(isFa()?1:-1);
    if(e.key==='ArrowRight')stepLB(isFa()?-1:1);
  }
});
var tx0=null;
$('#lightbox').addEventListener('touchstart',function(e){tx0=e.touches[0].clientX},{passive:true});
$('#lightbox').addEventListener('touchend',function(e){
  if(tx0==null)return; var dx=e.changedTouches[0].clientX-tx0; tx0=null;
  if(Math.abs(dx)>44)stepLB(dx<0?(isFa()?-1:1):(isFa()?1:-1));
},{passive:true});

function sendVia(kind){
  var txt=$('#chatText').value.trim()|| (isFa()?'سلام! ':'Hi! ')+D.profile.name;
  var c=D.contacts.filter(function(x){return x.kind===kind})[0];
  if(!c){toast(isFa()?'این راه ارتباطی در تماس‌ها نیست':'Contact not configured');return}
  var url='';
  if(kind==='telegram')url='https://t.me/'+String(c.id).replace(/^@/,'');
  if(kind==='whatsapp')url='https://wa.me/'+String(c.id).replace(/\D/g,'')+'?text='+encodeURIComponent(txt);
  if(kind==='email')url='mailto:'+c.id+'?subject='+encodeURIComponent(isFa()?'پیام از '+D.profile.name:'Message from '+D.profile.name)+'&body='+encodeURIComponent(txt);
  if(url)window.open(url,'_blank','noopener');
}
function pushMsg(text){D.messages.push({me:true,text:text,ts:Date.now()});save();renderChat()}

/* ---------- شروع ---------- */
function renderAll(){renderHome();renderGallery();renderProjects();renderMusic();renderChat();renderSocial();renderDrawer();applySettings()}
renderAll();
clock(); setInterval(clock,15000);
var h=(location.hash||'').replace('#','');
if(h&&$('#view-'+h))go(h);
$('#chatForm').addEventListener('submit',function(e){
  e.preventDefault();
  var ta=$('#chatText'), v=ta.value.trim();
  if(!v){toast(isFa()?'اول چیزی بنویسید ✍️':'Write something first');return}
  pushMsg(v); ta.value=''; ta.style.height='auto';
  setTimeout(function(){
    D.messages.push({me:false,text:isFa()
      ? 'پیامت ثبت شد ✓ برای ارسال واقعی، دکمه‌ی تلگرام/ایمیل را بزن.'
      : 'Saved locally ✓ Tap the Telegram/Email button to actually send it.',ts:Date.now()});
    save(); renderChat();
  },900);
});
$('#chatText').addEventListener('input',function(){
  this.style.height='auto'; this.style.height=Math.min(140,this.scrollHeight)+'px';
});
$('#admFile').addEventListener('change',function(){if(this.files&&this.files[0])admImport(this.files[0]);this.value=''});
window.addEventListener('hashchange',function(){var v=(location.hash||'').replace('#','');if(v&&v!==CUR)go(v)});
})();
</script>
</body>
</html>
