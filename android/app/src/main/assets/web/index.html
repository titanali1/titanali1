}
function admSave(){
  if(!W)return;
  if(!isAuth()){W=null;adm(false);loginSheet(true);return}
  if(admTab==='copy'){
    W.copy=W.copy||{};
    $$('[data-copyk]').forEach(function(n){var k=n.dataset.copyk,v=String(n.value==null?'':n.value);
      if(v.trim()==='')delete W.copy[k];else W.copy[k]=v});
    var cj=$('#copyJson');
    if(cj&&cj.dataset.dirty==='1'&&String(cj.value).trim()){
      try{var o=JSON.parse(cj.value);if(o&&typeof o==='object'&&!Array.isArray(o)){W.copy=o}else{toast('JSON متن‌ها باید شیء باشد ❌');return}}
      catch(e){toast('JSON متن‌ها نامعتبر است ❌');return}}
  }
  if(admTab==='stats'){
    $$('[data-sf]').forEach(function(n){var i=Number(n.dataset.i);if(!W.stats[i])return;
      if(n.dataset.sf==='v')W.stats[i].v=Math.max(0,Number(n.value)||0);else W.stats[i].k=n.value});
    W.stats=W.stats.filter(function(x){return x&&(String(x.k||'').trim()||Number(x.v)>0)});
  }
  if(admTab==='hobbies'){
    $$('[data-hf]').forEach(function(n){var i=Number(n.dataset.i);if(W.hobbies[i])W.hobbies[i][n.dataset.hf]=n.value});
    W.hobbies=(W.hobbies||[]).filter(function(x){return x&&String(x.t||'').trim()});
  }
  if(admTab==='gallery'){
    $$('#admBody [data-taginp]').forEach(function(n){var tv=normTag(n.value);if(!tv)return;
      var gi=Number(n.dataset.taginp),gg=W.gallery[gi];if(!gg)return;
      gg.tags=gg.tags||[];if(gg.tags.indexOf(tv)<0)gg.tags.push(tv);
      W.tags=W.tags||[];if(W.tags.indexOf(tv)<0)W.tags.unshift(tv)});
    W.tags=(W.tags||[]).filter(function(x){return x&&String(x).trim()});
    (W.gallery||[]).forEach(function(g){if(g.tags)g.tags=g.tags.filter(function(x){return x&&String(x).trim()})});
  }
  if(admTab==='buttons'||admTab==='contacts'){
    var bb=W.contacts=W.contacts||[];
    $$('[data-bf]').forEach(function(n){var i=Number(n.dataset.i);if(bb[i])bb[i][n.dataset.bf]=n.value});
    $$('[data-bon]').forEach(function(n){var i=Number(n.dataset.bon);if(bb[i])bb[i].on=n.checked?1:0});
    W.contacts=bb.filter(function(c){return c&&(c.id||c.label)});
  }
  if(admTab==='cats'||admTab==='hobbies'||admTab==='quick'||admTab==='gallery'||admTab==='buttons'||admTab==='contacts'||admTab==='stats'){
    var bad=0;
    $$('#admBody [data-rowjson]').forEach(function(t){
      if(t.dataset.dirty!=='1')return;
      var i=Number(t.dataset.rowjson);
      try{var o=JSON.parse(t.value);if(o&&typeof o==='object'&&!Array.isArray(o))W[LIST_KEY[admTab]][i]=o;else bad=1}
      catch(e){bad=1}
    });
    if(bad){toast(isFa()?'JSON یکی از ردیف‌ها نامعتبر است ❌':'Invalid row JSON');return}
  }
  if(admTab==='admins'){
    var ok=(W.admins||[]).filter(function(a){return a.u&&a.p});
    if(!ok.length){toast('حداقل یک ادمین با نام کاربری و رمز لازم است ❌');return}
    var seenU={};
    for(var k=0;k<W.admins.length;k++){var a=W.admins[k];
      if(!a.u||!a.p){toast('برای همهٔ ادمین‌ها نام کاربری و رمز پر کنید ❌');return}
      if(String(a.p).length<4){toast('رمز باید حداقل ۴ نویسه باشد ❌');return}
      if(seenU[a.u]){toast('نام کاربری تکراری است ❌');return} seenU[a.u]=1}
    if(!W.admins.some(function(x){return x.u===SESS.u})){toast('نام کاربری خودتان را حذف/عوض نکنید ❌');return}
  }
  else if(admTab==='instagram'||admTab==='feed'){
    try{W.ig.stories=JSON.parse($('#igStories').value||'[]')}catch(e){toast('JSON استوری‌ها نامعتبر است ❌');return}
    W.ig.user=$('#igUserInp').value.trim();W.ig.url=$('#igUrlInp').value.trim();
    W.ig.sub=$('#igSubInp').value.trim();W.ig.perLine=Math.max(1,Math.min(20,Number($('#igPerInp').value)||8));
    W.ig.commenter=$('#igCmtInp').value.trim()||'مهمان';
    W.ig.autoStories=$('#igAuto').checked?1:0;
    if($('#igAutoSync'))W.ig.autoSync=$('#igAutoSync').checked?1:0;
    try{var _fb=readFeedForm();if(_fb)W.feed=_fb}catch(e){}
  }
  else if(admTab==='profile'){$$('[data-pf]').forEach(function(n){W.profile[n.dataset.pf]=n.value})}
  else if(admTab==='settings'){
    W.settings.lang=$('#admLang').value;W.settings.bg=$('#admBg').value.trim();
    W.settings.theme=$('#admTheme').value.trim();W.settings.grid=$('#admGrid').value;
    var f=$('#admFoot').value.trim();if(f)W.settings.foot=f;else delete W.settings.foot;
    var nn=$('#setNeedName');if(nn)W.settings.needName=nn.checked?1:0;
    var np=$('#setNeedPhone');if(np)W.settings.needPhone=np.checked?1:0;
    var ap=$('#admApi');if(ap){var av=ap.value.trim();if(av)W.settings.api=av;else delete W.settings.api;}
  }else if(admTab==='stats'||admTab==='hobbies'||admTab==='contacts'||admTab==='quick'||admTab==='cats'){
    var j=$('#admJson');
    /* paneٔ فرمی = JSON‌ی نیست؛ همان فرم ذخیره می‌کند */
    try{if(j)W[admTab]=JSON.parse(j.value)}catch(e){toast('JSON نامعتبر است ❌');return}
  }
  W.gallery=(W.gallery||[]).filter(function(g){return g&&(g.t||g.img||g.desc)});
  W.cats=(W.cats||[]).filter(function(c){return c&&c.t});
  if(galFilter!=='all'&&!W.cats.some(function(c){return c.t===galFilter}))galFilter='all';
  if(admTab==='admins'&&SESS)SESS.u=(W.admins.filter(function(x){return x.name===SESS.name})[0]||W.admins[0]).u;
  D=clone(W);          /* کپی، نه خودِ W — وگرنه یک ذخیرهٔ ردشده روی دادهٔ زنده اثر می‌گذارد */
  if(save()){renderAll();toast(t('saved'));if($('#adminPanel').classList.contains('open'))renderAdmin();apiQueuePush()}
  afterAdminSave();
}
function admExport(){
  try{
    var blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='titanali-data.json';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},300);
    toast('خروجی JSON دانلود شد');
  }catch(e){copy(JSON.stringify(D,null,2),'دانلود نشد — JSON کپی شد')}
}
function admImport(file){
  var r=new FileReader();
  r.onload=function(){
    try{var o=JSON.parse(r.result);if(!o||typeof o!=='object')throw 0;
      D=merge(DEFAULTS,o);if(save())renderAll();toast('JSON بارگذاری شد ✓')
    }catch(e){toast('فایل معتبر نیست ❌')}
  };
  r.readAsText(file);
}
function admReset(){
  if(!confirm('بازگشت به داده‌های اولیه؟ تغییرات محلی پاک می‌شود.'))return;
  try{localStorage.removeItem(KEY)}catch(e){}
  D=clone(DEFAULTS);galFilter='all';save();renderAll();toast('به حالت اولیه برگشت');
}

/* ---------- پذیرش نسخهٔ منتشرشده روی هاست (وقتی api.php اجرا نمی‌شود) ----------
   پنل ادمین فایل titanali-content.json را کنار index.html می‌نویسد؛ اینجا همان را
   برمی‌داریم تا سایت بدون PHP هم تازه بماند. */
var BAKED={tried:false,rev:-1,ok:false};
function bakedPull(cb){
  if(API.on){BAKED.tried=true;if(cb)cb(false);return}
  var r0=0;try{r0=Number(localStorage.getItem('titanali.bakedRev'))||0}catch(e){}
  fetch('titanali-content.json?nc='+Math.floor(Date.now()/600000),{cache:'no-store'}).then(function(x){
    if(!x.ok)throw 0;
    return x.json();
  }).then(function(j){
    BAKED.tried=true;
    if(!j||j.app!=='titanali'||!j.data||typeof j.data!=='object'){if(cb)cb(false);return}
    var rev=Number(j.rev)||0;
    if(r0&&rev<=r0){BAKED.rev=r0;if(cb)cb(false);return}
    try{localStorage.setItem('titanali.prevLocal',JSON.stringify(D))}catch(e){}
    D=clone(j.data);ensure();BAKED.rev=rev;BAKED.ok=true;API.published=rev;
    try{localStorage.setItem('titanali.bakedRev',String(rev))}catch(e){}
    renderAll();
    toast(isFa()?'نسخهٔ منتشرشده روی هاست نمایش داده شد (rev '+num(rev)+')':'Showing published build (rev '+rev+')');
    if(cb)cb(true);
  }).catch(function(){BAKED.tried=true;if(cb)cb(false)});
}

function apiLogin(u,pp,done){
  taCall('login',{u:u,p:pp}).then(function(j){
    if(j&&j.ok&&j.token){apiTok(j.token);SESS={u:j.user,name:j.name,server:true};
      try{sessionStorage.setItem('titanali.sess',JSON.stringify(SESS))}catch(e){}
      done('ok');
    } else if(j&&j.__status===423)done('setup');
    else done('bad',(j&&j.error)||'')
  }).catch(function(){done('net')});
}
