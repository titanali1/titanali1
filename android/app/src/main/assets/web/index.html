/* =====================================================================
   iOS 26 — Liquid Glass theme (به‌سبک iPhone) · titanali
   ===================================================================== */
:root{
  --txt:#fff; --tx:#fff; --mut:rgba(255,255,255,.55); --acc:#2f9bff;
  --glass:rgba(255,255,255,.08); --glass2:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.14);
  --blue:#0a84ff; --blue2:#4da6ff; --green:#30d158; --red:#ff453a;
  --orange:#ff9f0a; --pink:#ff375f; --purple:#a855f7; --yellow:#ffd60a;
  --r:22px; --shadow:0 12px 32px rgba(0,0,0,.4);
  /* legacy tokens (پنل مدیریت و کلاس‌های قدیمی) */
  --panel:rgba(255,255,255,.08); --elev:rgba(255,255,255,.06); --elev2:rgba(255,255,255,.12);
  --line2:rgba(255,255,255,.14); --dim:rgba(255,255,255,.55); --faint:rgba(255,255,255,.35);
  --c1:#4da6ff; --c2:#a855f7; --c3:#4da6ff; --bg:#050409;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Vazirmatn','Segoe UI',Tahoma,system-ui,sans-serif;
  color:var(--txt);min-height:100vh;background:#050409;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.85;
}
button{font-family:inherit;cursor:pointer;color:inherit}
img{background:#101018;max-width:100%}
a{color:var(--blue2);text-decoration:none}
[hidden]{display:none!important}
::selection{background:rgba(10,132,255,.35)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}

/* ---------- پس‌زمینه ---------- */
.bg-cover{position:fixed;inset:0;background-size:cover;background-position:center;z-index:0;transition:opacity .4s}
.bg-scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(900px 500px at 85% -8%,rgba(168,85,247,.20),transparent 60%),
             radial-gradient(760px 460px at 10% 8%,rgba(10,132,255,.18),transparent 60%),
             radial-gradient(700px 520px at 50% 108%,rgba(255,55,95,.12),transparent 60%);}
.bg-scene .blob{display:none}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,5,12,.55),rgba(6,5,12,.86))}

/* ---------- نوار وضعیت آیفون ---------- */
.ios-statusbar{position:fixed;top:0;inset-inline:0;margin:auto;width:100%;max-width:430px;
  display:flex;justify-content:space-between;align-items:center;padding:13px 22px 8px;z-index:100;
  direction:ltr;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent);pointer-events:none}
.ios-statusbar #sbTime{font-size:15px;font-weight:600;min-width:56px;letter-spacing:.2px}
.sb-icons{display:flex;align-items:center;gap:6px;color:#fff}

/* ---------- قالب کلی ---------- */
#app{position:relative;z-index:1}
.shell{max-width:430px;margin:0 auto;min-height:100vh;position:relative}
.shell-body{position:relative}
.view{display:none}
.view.active{display:block;animation:viewIn .35s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view#view-home{padding-bottom:140px}
.ios-topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:56px 18px 14px}
.ios-brand-name{font-size:30px;font-weight:800;letter-spacing:.01em;line-height:1.2}
.ios-tagline{color:var(--mut);font-size:13px;margin-top:4px;max-width:32ch}
.ios-menu{width:46px;height:46px;flex:none;border-radius:50%;background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);
  display:grid;place-items:center;padding:0}
.ios-menu span{display:block;width:20px;height:2px;border-radius:2px;background:#fff;margin:2.5px auto;transition:.3s}
.ios-menu.on span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.ios-menu.on span:nth-child(2){opacity:0}
.ios-menu.on span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.ios-main{padding:4px 16px 0}

/* ---------- کارت شیشه‌ای ---------- */
.ios-card,.sec{background:var(--glass);backdrop-filter:blur(30px) saturate(1.5);
  -webkit-backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.sec{padding:16px}
.sec-title{font-size:16.5px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.sec-title::before{content:'';width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,var(--blue2),var(--purple))}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-head .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
.card-head b{font-size:15px}
.card-head .sp{margin-inline-start:auto;color:var(--mut);font-size:11.5px}

/* ---------- کارت پروفایل ---------- */
.hero{padding:22px 18px 18px;text-align:center}
.avatar{position:relative;width:104px;height:104px;margin:0 auto 14px}
.avatar-ring{position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 210deg,var(--blue2),var(--purple),var(--pink),var(--blue2));
  filter:blur(9px);opacity:.75;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar-img,.avatar-fallback{position:absolute;inset:0;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.2)}
.avatar-fallback{display:grid;place-items:center;font-size:34px;font-weight:800;
  background:linear-gradient(135deg,rgba(10,132,255,.35),rgba(168,85,247,.35));backdrop-filter:blur(10px)}
.avatar.no-img .avatar-img{display:none}
.avatar:not(.no-img) .avatar-img{display:block}
.avatar:not(.no-img) .avatar-fallback{display:none}
.hero-name{font-size:25px;font-weight:800}
.hero-role{color:var(--blue2);font-size:14px;margin-top:3px;font-weight:600}
.hero-loves{color:var(--mut);font-size:13px;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px}
.hero-loves .i{color:var(--blue2)}
.prose{color:rgba(255,255,255,.74);font-size:13.5px;line-height:2;white-space:pre-line}

/* ---------- ردیف‌های لیستی iOS ---------- */
.ios-list{display:flex;flex-direction:column}
.ios-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08);
  text-align:start;background:none;border-inline:0;border-top:0;width:100%;color:inherit}
.ios-row:last-child{border-bottom:0}
.ios-row:active{background:rgba(255,255,255,.07)}
.ios-row .ric{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;font-size:16px}
.ios-row .rmeta{flex:1;min-width:0}
.ios-row .rtitle{font-size:14.5px;font-weight:700}
.ios-row .rsub{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
.ios-row .rchev{color:var(--faint);font-size:18px;flex:none}
.sec .ios-row{padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.07)}

/* ---------- چیپ‌ها (علاقه / برچسب / تگ) ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
.chip.b{background:rgba(10,132,255,.16);border-color:rgba(10,132,255,.35);color:var(--blue2)}
.hobby-grid{display:flex;flex-wrap:wrap;gap:8px}
.hobby{display:inline-flex;align-items:center;gap:7px;background:var(--glass2);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}

/* ---------- کارت طرح (طرح‌های منتخب) ---------- */
.proj-grid{display:flex;flex-direction:column;gap:12px}
.proj{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.proj-img{width:100%;height:170px;object-fit:cover;display:block}
.proj-body{padding:13px 14px}
.proj-title{font-size:15.5px;font-weight:800}
.proj-desc{color:rgba(255,255,255,.7);font-size:13px;margin-top:6px;line-height:1.9}
.proj-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);border-radius:999px;
  padding:3px 10px;font-size:11.5px;color:rgba(255,255,255,.8)}
.pf-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.pf-year{font-size:11.5px;color:var(--blue2);background:rgba(10,132,255,.14);border:1px solid rgba(10,132,255,.32);border-radius:999px;padding:3px 10px}
.proj-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pbtn{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff}
.pbtn:active{transform:scale(.97)}
.pbtn.primary{background:linear-gradient(135deg,var(--blue2),var(--blue));border-color:transparent;color:#fff;
  box-shadow:0 6px 18px rgba(10,132,255,.3)}

/* ---------- گالری ---------- */
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gitem{position:relative;border-radius:14px;overflow:hidden;background:#101018;border:1px solid var(--line);aspect-ratio:1}
.gitem img{width:100%;height:100%;object-fit:cover;display:block;transition:.25s}
.gitem:active img{transform:scale(1.05)}
.gitem .gtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.gitem .gtags i{background:rgba(10,132,255,.26);border:1px solid rgba(140,190,255,.35);border-radius:999px;
  padding:1px 6px;font-size:9.5px;font-style:normal;font-weight:700;color:#dbeaff;white-space:nowrap}
@media (min-width:1024px){.gitem .gtags i{font-size:11px;padding:2px 8px}}
.lb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lb-tags .tag{text-decoration:none}
.gitem .gcap{position:absolute;inset-inline:0;bottom:0;padding:20px 9px 7px;font-size:11px;color:#fff;
  background:linear-gradient(to top,rgba(0,0,0,.8),transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gallery-cta{display:flex;justify-content:center;margin-top:12px}
.ios-pill{display:inline-flex;align-items:center;gap:8px;background:var(--glass2);backdrop-filter:blur(20px);
  border:1px solid var(--line);color:#fff;border-radius:999px;padding:11px 18px;font-size:13.5px;font-weight:600}
.ios-pill:active{transform:scale(.97)}
.ios-cta{display:flex;justify-content:center;margin:2px 0 16px}

/* ---------- دکمهٔ کوچک (کپی) ---------- */
.tr-btn{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;font-size:13px;padding:0}

/* ---------- تماس‌ها ---------- */
.contact-grid{display:flex;flex-direction:column}
.contact{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.07);color:inherit}
.contact:last-child{border-bottom:0}
.contact:active{background:rgba(255,255,255,.06)}
.contact-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;font-size:16px}
.contact-meta{flex:1;min-width:0}
.contact-label{font-size:14.5px;font-weight:700}
.contact-id{font-size:12px;color:var(--mut);direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact-arrow{color:var(--faint);font-size:18px;flex:none}

/* ---------- داک پایین ---------- */
.ios-bottom{position:fixed;bottom:0;inset-inline:0;margin:auto;width:100%;max-width:430px;z-index:80;pointer-events:auto;
  padding:26px 14px 8px;background:linear-gradient(180deg,transparent,rgba(4,3,9,.78) 45%)}
.ios-dock{display:flex;justify-content:center;gap:30px;background:rgba(255,255,255,.14);
  backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
  border:1px solid rgba(255,255,255,.2);border-radius:32px;padding:13px 22px;margin-bottom:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.35)}
.app-ic{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0}
.app-ic .ic{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.35);transition:.15s}
.app-ic:active .ic{transform:scale(.9)}
.app-ic .ic.gal{background:linear-gradient(135deg,#ff9f0a,#ff375f)}
.app-ic .ic.cht{background:linear-gradient(135deg,#66e089,#25a852)}
.app-ic .ic.msc{background:linear-gradient(135deg,#a855f7,#0a84ff)}
.app-ic .ic.prj{background:linear-gradient(135deg,#a855f7,#0a84ff)}
.app-ic .ic.soc{background:linear-gradient(135deg,#4da6ff,#0a84ff)}
.app-ic .ic.gen{background:linear-gradient(135deg,#64748b,#3b4a63)}
/* soc-tile / gen-tile / sec-tile مشترک‌اند */
.app-ic .lbl{font-size:11px;color:#fff;opacity:.92;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-ic .badge{position:absolute;top:-4px;inset-inline-end:calc(50% - 30px)}
.badge{min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;
  display:grid;place-items:center;padding:0 5px}
.home-indicator{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.85);margin:4px auto 0}

/* ---------- منوی کشویی (drawer) ---------- */
.drawer-wrap{position:fixed;inset:0;z-index:120;visibility:hidden}
.drawer-wrap.open{visibility:visible}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:.25s}
.drawer-wrap.open .backdrop{opacity:1}
.drawer{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(84vw,330px);
  background:rgba(22,20,30,.95);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border-inline-start:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;
  padding:50px 14px 18px;gap:4px;transform:translateX(var(--dx,100%));
  transition:transform .28s var(--ease);overflow:auto}
html[dir=rtl] .drawer{--dx:-100%}
.drawer-wrap.open .drawer{transform:none}
.d-profile{display:flex;align-items:center;gap:11px;padding:10px 10px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}
.d-av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(10,132,255,.4),rgba(168,85,247,.4));font-weight:800}
.d-av img{width:100%;height:100%;object-fit:cover}
.d-pn{font-size:15px;font-weight:800}
.d-pr{font-size:12px;color:var(--mut)}
.d-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:14px;
  background:none;border:0;font-size:15px;text-align:start;color:#fff}
.d-item:active{background:rgba(255,255,255,.08)}
.d-ic{width:38px;height:38px;border-radius:11px;background:rgba(10,132,255,.14);color:var(--blue2);
  display:grid;place-items:center;flex:none}
.d-lab{flex:1}
.d-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);color:var(--mut);font-size:11.5px;text-align:center}

/* ---------- اپ پیام (iOS Messages) ---------- */
#view-chat,#view-gallery,#view-social{padding-bottom:140px}
.ios-appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:6px;padding:50px 12px 10px;
  background:rgba(10,9,16,.82);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-bottom:1px solid rgba(255,255,255,.12)}
.ios-back{width:38px;height:38px;flex:none;border-radius:50%;background:none;border:0;color:var(--blue);display:grid;place-items:center}
.ios-appbar-mid{flex:1;min-width:0;text-align:center}
.ios-appbar-title{font-size:17px;font-weight:700}
.ios-appbar-sub{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(48,209,88,.18);display:inline-block}
.ios-appbar-sp{width:38px;flex:none}
.chat-hero{padding:22px 18px;text-align:center}
.chat-hero .big{width:74px;height:74px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--green),#0f9b4a);box-shadow:0 10px 26px rgba(37,168,82,.35)}
.chat-note{background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.2);border-radius:16px;
  padding:12px 14px;font-size:13px;color:rgba(255,255,255,.75);margin:0 16px 14px}
.ios-composer{padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
.c-row{display:flex;gap:8px;align-items:flex-end}
.c-row input,.c-row textarea{flex:1;min-width:0;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);
  border-radius:20px;padding:12px 15px;color:#fff;font-size:14px;outline:none;font-family:inherit;resize:none}
.c-row input:focus,.c-row textarea:focus{border-color:var(--blue)}
.c-send{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--blue);color:#fff;
  display:grid;place-items:center;font-size:17px;padding:0;box-shadow:0 6px 16px rgba(10,132,255,.35)}
.c-send:active{transform:scale(.92)}
.msg-form{display:flex;flex-direction:column;gap:9px;width:100%}
.form-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- تب گالری (دسته‌بندی + لایت‌باکس) ---------- */
.gal-tabs{display:flex;gap:8px;padding:2px 16px 14px;overflow-x:auto;scrollbar-width:none}
.gal-tabs::-webkit-scrollbar{display:none}
.gal-tab{flex:none;background:var(--glass);border:1px solid var(--line);color:var(--mut);
  border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;transition:.2s}
.gal-tab.on{background:linear-gradient(135deg,var(--blue2),var(--blue));border-color:transparent;color:#fff}
.gitem.wide{grid-column:span 2;aspect-ratio:2/1}
.lb{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);display:grid;
  grid-template-rows:1fr auto;opacity:0;pointer-events:none;transition:.25s var(--ease)}
.lb.open{opacity:1;pointer-events:auto}
.lb-stage{display:grid;place-items:center;padding:16px;min-height:0}
.lb-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);transition:transform .25s var(--ease)}
.lb-bar{display:flex;align-items:center;gap:10px;padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  max-width:430px;margin:0 auto;width:100%}
.lb-cap{flex:1;min-width:0;font-size:13px;font-weight:700;color:rgba(255,255,255,.9);text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-idx{font-size:12px;color:var(--mut);direction:ltr}
.lb-btn{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;font-size:16px;padding:0}

/* ---------- حباب‌های گفتگو ---------- */
.chat-log{display:flex;flex-direction:column;gap:9px;padding:14px 16px 4px}
.bubble{max-width:78%;padding:10px 14px;border-radius:19px;font-size:13.5px;line-height:1.85;
  word-break:break-word;animation:bubbleIn .3s var(--ease)}
@keyframes bubbleIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.bubble.them{align-self:flex-start;background:rgba(255,255,255,.11);border:1px solid var(--line);
  border-start-start-radius:6px}
.bubble.me{align-self:flex-end;background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;
  border-end-end-radius:6px}
.b-when{display:block;font-size:10px;opacity:.6;margin-top:4px;direction:ltr}
.chat-empty{text-align:center;color:var(--mut);font-size:13px;padding:22px 16px}
.q-replies{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 10px}

/* ---------- کاشی‌های اشتراک‌شده (soc-tile / gen-tile / sec-tile) ---------- */
.tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px 14px}
.soc-tile,.gen-tile,.sec-tile{display:flex;flex-direction:column;align-items:center;gap:8px;
  background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px 10px;
  text-align:center;color:#fff;transition:.18s var(--ease)}
.soc-tile:active,.gen-tile:active,.sec-tile:active{transform:scale(.96);background:var(--glass2)}
.soc-tile .tic,.gen-tile .tic,.sec-tile .tic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  font-size:19px;color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.3)}
.soc-tile .tl,.gen-tile .tl,.sec-tile .tl{font-size:13px;font-weight:700}
.soc-tile .ts,.gen-tile .ts,.sec-tile .ts{font-size:11px;color:var(--mut);direction:ltr;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- آمار ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:11px 8px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:800;line-height:1.4}
.stat span{font-size:11px;color:var(--mut)}

/* ---------- اعلان‌ها و میان‌بُر ---------- */
.toast{position:fixed;bottom:126px;inset-inline:0;margin:auto;width:max-content;max-width:88vw;z-index:300;
  background:rgba(28,26,38,.94);border:1px solid var(--line);border-radius:999px;padding:11px 20px;
  font-size:13px;font-weight:600;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);opacity:0;transform:translateY(12px);transition:.25s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:none}
.empty{padding:26px 16px;text-align:center;color:var(--mut);font-size:13px}
.hr{height:1px;background:var(--line);margin:12px 0}

/* ---------- پنل مدیریت (سردر پایین iOS) ---------- */
.adm-wrap{position:fixed;inset:0;z-index:220;visibility:hidden}
.adm-wrap.open{visibility:visible}
.adm{position:absolute;inset-inline:0;bottom:0;max-width:430px;margin:0 auto;max-height:92vh;display:flex;flex-direction:column;
  background:rgba(16,14,24,.97);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;transform:translateY(101%);
  transition:transform .32s var(--ease)}
.adm-wrap.open .adm{transform:none}
.adm-grab{width:42px;height:4px;border-radius:2px;background:rgba(255,255,255,.28);margin:9px auto 0}
.adm-head{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.adm-head b{font-size:16px}
.adm-x{margin-inline-start:auto;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.12);
  color:#fff;display:grid;place-items:center;font-size:14px;padding:0}
.adm-tabs{display:flex;gap:7px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.adm-tabs::-webkit-scrollbar{display:none}
.adm-tab{flex:none;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--mut);
  border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700}
.adm-tab.on{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;border-color:transparent}
.adm-body{padding:14px 16px 8px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.adm-pane{display:none;flex-direction:column;gap:10px}
.adm-pane.on{display:flex}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:12px;color:var(--mut);font-weight:700}
.adm input,.adm textarea,.adm select{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;color:#fff;font-size:13px;font-family:inherit;outline:none}
.adm textarea{min-height:150px;line-height:1.7;direction:ltr;text-align:start;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.adm input:focus,.adm textarea:focus{border-color:var(--blue);background:rgba(10,132,255,.08)}
.adm-foot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line)}
.adm-foot .pbtn{flex:1;justify-content:center;min-width:110px}
.adm-id{display:flex;flex-direction:column;gap:2px;min-width:0}
.adm-id b{font-size:15.5px;letter-spacing:-.2px}
.adm-pills{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;border-radius:999px;padding:4px 9px;
  border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--mut);white-space:nowrap}
.pill.ok{color:#8ef0b6;border-color:rgba(48,209,88,.4);background:rgba(48,209,88,.14)}
.pill.warn{color:#ffd98a;border-color:rgba(255,204,102,.42);background:rgba(255,204,102,.14)}
.pill.bad{color:#ffb3ae;border-color:rgba(255,69,58,.42);background:rgba(255,69,58,.14)}
.pill.info{color:var(--blue2);border-color:rgba(10,132,255,.42);background:rgba(10,132,255,.14)}
.adm-find{padding:9px 14px 0}
.adm-find input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:11px;color:var(--tx);
  padding:8px 12px;font-size:13px;font-family:inherit}
.adm-dirty{margin:9px 14px 0;border:1px dashed rgba(255,204,102,.5);background:rgba(255,204,102,.1);color:#ffd98a;
  border-radius:12px;padding:9px 11px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.adm-dirty button{border:0;border-radius:9px;padding:6px 10px;font-size:11.5px;font-weight:800;background:#ffd98a;color:#241a00;cursor:pointer}
.adm-dirty button.ghost{background:transparent;color:#ffd98a;border:1px solid rgba(255,204,102,.5)}
.adm-tab{display:inline-flex;align-items:center;gap:6px}
.adm-tab em{font-style:normal;font-size:10px;opacity:.8;background:rgba(255,255,255,.14);border-radius:8px;padding:1px 6px;min-width:18px;text-align:center}
.adm-tab.on em{background:rgba(255,255,255,.26)}
.row-tools{display:flex;gap:5px;margin-inline-start:auto;flex-wrap:wrap}
.row-tools button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--mut);border-radius:9px;
  min-width:28px;height:26px;font-size:11.5px;font-weight:800;cursor:pointer;padding:0 7px}
.row-tools button:hover{color:var(--tx);border-color:rgba(255,255,255,.3)}
.row-tools button.del{color:#ffb3ae;border-color:rgba(255,69,58,.36)}
.adm-sec{border:1px solid var(--line);border-radius:15px;padding:11px 12px;background:rgba(255,255,255,.035);display:flex;flex-direction:column;gap:9px}
.adm-sec>h4{margin:0;font-size:12.5px;font-weight:800;color:var(--tx);display:flex;align-items:center;gap:7px}
.adm-sec>h4 small{font-weight:600;color:var(--mut);font-size:11px;margin-inline-start:auto}
.adm-2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pbtn.pub{border-color:rgba(10,132,255,.5);background:linear-gradient(135deg,rgba(10,132,255,.22),rgba(10,132,255,.08));color:#cfe6ff}
.pbtn.pub.busy{opacity:.65}
.publine{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.publine b{color:var(--tx)}
.pubbig{font-size:26px;font-weight:900;color:var(--tx);line-height:1.2;letter-spacing:-.5px}
.adm details.rowjson{margin-top:6px}
.adm details.rowjson summary{font-size:11px;color:var(--mut);cursor:pointer}
.adm details.rowjson textarea{min-height:120px;font-size:11px}
.chat-acts{display:flex;gap:7px;overflow-x:auto;padding:8px 2px 2px;scrollbar-width:none}
.chat-acts::-webkit-scrollbar{display:none}
.chat-acts a{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;text-decoration:none;
  border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.06);color:var(--tx);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.fbtn.busy svg{animation:none}}
.hint{font-size:11.5px;color:var(--mut);line-height:1.8}
.kbd{display:inline-block;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:6px;
  padding:1px 6px;font-size:11px;direction:ltr}

/* ---------- بلوکه‌سازی spanها تا ellipsis واقعاً کار کند ---------- */
.rtitle,.rsub,.contact-label,.contact-id,.lb-cap,.lb-desc{display:block}
.d-h{font-size:11px;color:var(--mut);padding:12px 12px 4px;font-weight:800;letter-spacing:.02em}

/* ---------- بنر دسته‌ی گالری ---------- */
.cat-banner{margin:0 16px 12px;padding:13px 15px;background:linear-gradient(160deg,rgba(10,132,255,.16),rgba(168,85,247,.12));
  border:1px solid var(--line);border-radius:18px}
.cat-banner b{display:block;font-size:14.5px;font-weight:800}
.cat-banner p{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:5px;line-height:1.9}
.gitem .gnew{position:absolute;top:7px;inset-inline-start:7px;background:var(--blue);color:#fff;
  font-size:10px;font-weight:800;border-radius:999px;padding:2px 8px;box-shadow:0 4px 10px rgba(10,132,255,.4)}
.lb-desc{font-size:12.5px;color:rgba(255,255,255,.7);text-align:center;max-width:430px;margin:0 auto;padding:0 18px 6px;line-height:1.9}

/* ---------- ادمین: ویرایشگر طرح (عکس + توضیحات) ---------- */
.row-card{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:11px;
  display:flex;flex-direction:column;gap:9px}
.row-head{display:flex;align-items:center;gap:9px}
.row-head .n{font-size:12px;color:var(--mut);font-weight:800;min-width:20px}
.row-del{margin-inline-start:auto;width:30px;height:30px;border-radius:9px;border:1px solid rgba(255,69,58,.4);
  background:rgba(255,69,58,.14);color:#ffb3ae;font-size:13px;padding:0;flex:none}
.up{display:flex;gap:10px;align-items:center}
.thumb{width:70px;height:70px;border-radius:13px;flex:none;object-fit:cover;border:1px solid var(--line);background:#101018}
.up-btns{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.up-btns .pbtn{justify-content:center;padding:8px 10px;font-size:12px}
.row-card input,.row-card textarea,.row-card select{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--line);
  border-radius:11px;padding:9px 11px;color:#fff;font-size:12.5px;font-family:inherit;outline:none}
.row-card textarea{min-height:62px;line-height:1.75;resize:vertical}
.row-card input:focus,.row-card textarea:focus,.row-card select:focus{border-color:var(--blue)}
.row-card select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,rgba(255,255,255,.5) 50%),
  linear-gradient(135deg,rgba(255,255,255,.5) 50%,transparent 50%);background-position:calc(0% + 12px) 17px,calc(0% + 17px) 17px;
  background-size:5px 5px;background-repeat:no-repeat}
.add-row{border:1px dashed rgba(255,255,255,.26);border-radius:16px;padding:13px;text-align:center;
  background:rgba(255,255,255,.04);font-size:13.5px;font-weight:700;color:var(--blue2)}
.size-note{font-size:11px;color:var(--mut);direction:ltr}

/* =====================================================================
   پوستهٔ تازهٔ پنل مدیریت — سرمه‌ای، کارت‌های گرد، تب قرصی درخشان
   (هم‌زبان با ظاهر سایت؛ همهٔ قواعد با .adm-wrap تا جایی نشت نکند)
   ===================================================================== */
.adm-wrap .adm{position:absolute;inset-inline:0;bottom:0;width:100%;max-width:860px;margin:0 auto;
  max-height:94vh;max-height:96dvh;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(130% 70% at 50% -12%,#1a2a46 0%,#0d1626 38%,#070c16 100%);
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,.09);border-bottom:0;border-radius:32px 32px 0 0;
  box-shadow:0 -24px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);
  transform:translateY(101%);transition:transform .4s var(--ease)}
.adm-wrap.open .adm{transform:none}
@media (min-width:780px){.adm-wrap .adm{bottom:20px;border-bottom:1px solid rgba(255,255,255,.09);
  border-radius:32px;max-height:calc(100dvh - 40px)}
  .adm-wrap .adm-grab{display:none}
  .adm-wrap .adm{box-shadow:0 30px 80px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.07)}}
.adm-wrap .adm-grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:10px auto 0}
/* سربرگ */
.adm-wrap .adm-head{display:grid;grid-template-columns:1fr auto;gap:12px 10px;align-items:start;
  padding:14px 20px 13px;border-bottom:1px solid rgba(255,255,255,.07)}
.adm-wrap .adm-id b{display:block;font-size:20px;font-weight:800;letter-spacing:-.4px;color:#fff}
.adm-wrap .adm-id .who{display:block;margin-top:5px;font-size:12px;color:rgba(255,255,255,.52)}
.adm-wrap .adm-id .who b{color:#cfe6ff;font-weight:800;font-size:12px}
.adm-wrap .adm-acts{display:flex;align-items:center;gap:8px}
.adm-wrap .adm-btn{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;
  border-radius:16px;padding:10px 15px;font-size:12.5px;font-weight:800;cursor:pointer;transition:.2s var(--ease)}
.adm-wrap .adm-btn:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
.adm-wrap .adm-btn.danger{color:#ffb3ae;border-color:rgba(255,69,58,.36);background:rgba(255,69,58,.13)}
.adm-wrap .adm-x{width:34px;height:34px;border-radius:12px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);color:rgba(255,255,255,.75);display:grid;place-items:center;font-size:13px;padding:0;
  cursor:pointer;transition:.2s var(--ease)}
.adm-wrap .adm-x:hover{background:rgba(255,255,255,.14);color:#fff;transform:rotate(90deg)}
.adm-wrap .adm-pills{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;margin:0}
/* جست‌وجو */
.adm-wrap .adm-find{position:relative;padding:12px 20px 0}
.adm-wrap .adm-find .ic{position:absolute;inset-inline-start:34px;top:60%;transform:translateY(-50%);font-size:13px;opacity:.5;pointer-events:none}
.adm-wrap .adm-find input{width:100%;background:rgba(4,10,22,.5);border:1px solid rgba(255,255,255,.1);border-radius:16px;
  color:#fff;padding:11px 44px;font-size:13px;font-family:inherit;outline:none}
.adm-wrap .adm-find .hit{position:absolute;inset-inline-end:62px;top:60%;transform:translateY(-50%);font-size:11px;
  font-weight:800;color:#cfe6ff;background:rgba(30,140,255,.16);border:1px solid rgba(30,140,255,.3);
  border-radius:9px;padding:2px 8px;pointer-events:none}
.adm-wrap .adm-find .hit:empty{display:none}
.adm-wrap .adm-find .fx{position:absolute;inset-inline-end:31px;top:60%;transform:translateY(-50%);width:24px;height:24px;
  border:0;border-radius:8px;background:rgba(255,255,255,.1);color:#fff;font-size:11px;display:grid;place-items:center;cursor:pointer;padding:0}
/* تب‌ها */
.adm-wrap .backdrop{position:absolute;inset:0;background:rgba(2,6,14,.72);opacity:0;transition:opacity .3s;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.adm-wrap.open .backdrop{opacity:1}
.adm-wrap .adm-tabs{display:flex;gap:8px;margin:13px 20px 2px;padding:7px;overflow-x:auto;scrollbar-width:none;
  scroll-snap-type:x proximity;background:rgba(3,8,18,.55);border:1px solid rgba(255,255,255,.08);border-radius:22px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.adm-wrap .adm-tabs::-webkit-scrollbar{display:none}
.adm-wrap .adm-tab{flex:none;scroll-snap-align:center;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.62);
  border-radius:999px;padding:10px 16px;font-size:13px;font-weight:800;cursor:pointer;transition:.22s var(--ease)}
.adm-wrap .adm-tab:hover{color:#fff;background:rgba(255,255,255,.1)}
.adm-wrap .adm-tab.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,#4da3ff,#0a6cff);
  box-shadow:0 10px 28px rgba(20,130,255,.42),inset 0 1px 0 rgba(255,255,255,.3);transform:translateY(-1px)}
.adm-wrap .adm-tab em{background:rgba(255,255,255,.16);border-radius:9px;padding:1px 7px;font-size:10.5px;font-weight:800;font-style:normal}
.adm-wrap .adm-tab.on em{background:rgba(255,255,255,.28)}
/* بدنه و کارت بخش */
.adm-wrap .adm-body{display:block;padding:14px 16px 12px;overflow:auto;flex:1;scrollbar-width:thin}
.adm-wrap .adm-body::-webkit-scrollbar{width:8px}
.adm-wrap .adm-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
.adm-wrap .adm-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:28px;

/* ══ گفتگو: نام و شماره تلفن ══ */
.chat .who-bar{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:16px;padding:9px 10px 10px}

  font-size:11px;font-weight:800;color:rgba(255,255,255,.78)}

.chat .who-fs{display:grid;grid-template-columns:1fr;gap:7px}
.chat .who-f{display:flex;flex-direction:column;gap:4px;font-size:10.5px;font-weight:700;
  color:rgba(255,255,255,.5)}

  border-radius:14px;padding:10px 13px;color:#fff;font-size:13.5px;outline:none;font-family:inherit}
.chat .who-f input:focus{border-color:var(--blue);background:rgba(255,255,255,.12)}
.chat .who-f input.bad{border-color:var(--red);animation:shake .3s}
.chat .who-f input::placeholder{color:rgba(255,255,255,.28)}
.chat .who-done{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:16px;

  border:1px solid rgba(120,170,255,.26)}
.chat .who-done .wd-ic{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.12);font-size:14px}

.chat .who-done .wd-id b{font-size:12.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .who-done .wd-id a{font-size:11.5px;color:var(--blue2);text-decoration:none;font-weight:700}
.chat .wd-edit{flex:none;width:30px;height:30px;border-radius:10px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.07);color:#fff;font-size:13px;padding:0;display:grid;place-items:center}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(4px)}75%{transform:translateX(-4px)}}
@media (min-width:700px){.chat .who-fs{grid-template-columns:1fr 1fr}.chat .who-bar{padding:11px 12px 12px}}

.adm-wrap .opt-more summary{font-size:12px;font-weight:700;color:rgba(255,255,255,.62);cursor:pointer}
.adm-wrap .opt-more[open]{background:rgba(4,10,22,.3);border-radius:16px;padding:10px 12px 12px}
/* شبکه‌های اجتماعی */
.adm-wrap .netchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.adm-wrap .netchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:800;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:rgba(255,255,255,.74);cursor:pointer;transition:.2s var(--ease)}
.adm-wrap .netchip:hover{color:#fff;background:rgba(255,255,255,.12);transform:translateY(-1px)}
.adm-wrap .netchip.on{border-color:rgba(120,180,255,.42);background:rgba(30,140,255,.14);color:#dcecff}
.adm-wrap .netchip em{font-style:normal;font-size:10px;background:rgba(255,255,255,.16);border-radius:999px;padding:1px 6px}
.adm-wrap .sw-kic{width:30px;height:30px;border-radius:11px;display:grid;place-items:center;font-size:14px;color:#fff;flex:none}
.adm-wrap .sw-lab{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.74);margin-inline-start:auto}
.adm-wrap .sw-lab input[type=checkbox]{width:18px;height:18px}
.adm-wrap .chip-preview{display:flex;gap:8px;flex-wrap:wrap;padding:11px 12px;border-radius:18px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.adm-wrap .hint.sm{font-size:11px;opacity:.85;margin-top:-3px}
/* انتخاب تصویر از گالری */
.adm-wrap .picpick{border:1px solid rgba(120,180,255,.28);background:linear-gradient(180deg,rgba(30,140,255,.1),rgba(30,140,255,.03));

.adm-wrap .pp-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:11px}
.adm-wrap .pp-h span{font-size:13px;font-weight:800}
.adm-wrap .pp-h small{font-size:11px;color:rgba(255,255,255,.52)}
.adm-wrap .pp-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.adm-wrap .pp-prev{width:106px;height:106px;border-radius:20px;object-fit:cover;border:1px solid rgba(255,255,255,.16);background:#0a1220;flex:none}
.adm-wrap .pp-prev.none{display:grid;place-items:center;font-size:11px;color:rgba(255,255,255,.45);text-align:center;padding:8px}
.adm-wrap .pp-btns{display:flex;flex-direction:column;gap:8px;flex:1;min-width:170px}
.adm-wrap .pp-btns .pbtn{justify-content:center}
@media (max-width:860px){.adm-wrap .h-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* کارت استودیو در خانه */
.ios-card.studio{padding:14px 16px 16px}
.ios-card.studio:empty{display:none}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.hstats .st{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:11px 6px;text-align:center}
.hstats .st b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px}
.hstats .st span{display:block;font-size:10.5px;color:var(--mut);margin-top:3px;font-weight:700;line-height:1.5}
.studio-t{font-size:11.5px;font-weight:800;color:var(--mut);margin-top:15px}
.hbh{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
@media (max-width:430px){
  .adm-wrap .adm-head{padding:12px 15px 11px}
  .adm-wrap .adm-id b{font-size:18px}

  .adm-wrap .adm-find{padding:11px 15px 0}
  .adm-wrap .adm-find .ic{inset-inline-start:28px}
  .adm-wrap .adm-find .fx{inset-inline-end:26px}
  .adm-wrap .adm-card{border-radius:24px;padding:13px 12px}
  .adm-wrap .adm-body{padding:11px 10px 9px}
  .adm-wrap .adm-foot{padding-left:15px;padding-right:15px}
  .adm-wrap .adm-acts{gap:6px}
  .adm-wrap .adm-btn{padding:9px 11px;font-size:12px;border-radius:14px}
  .adm-wrap .adm-card-h{padding-bottom:11px}
  .adm-wrap .adm-card-h b{font-size:15px}
  .adm-wrap .adm-note{padding:11px 12px;font-size:12px;border-radius:18px}
}
@media (prefers-reduced-motion:reduce){.adm-wrap .adm,.adm-wrap .adm-tab,.adm-wrap .pbtn,.adm-wrap .row-card{transition:none}}

/* ================= فید اینستاگرام (سایز و چیدمان واقعی) ================= */
:root{--igRatio:calc(4 / 5)}
.ig-feed{padding:0}
.fbar{display:flex;align-items:center;gap:9px;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.fbar .fb-user{display:flex;align-items:center;gap:8px;min-width:0}
.fbar .fb-av{width:34px;height:34px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:12px;
  background:conic-gradient(from 200deg,#f9ce34,#ee2a7b,#6228d7,#f9ce34);padding:1.5px}
.fbar .fb-av>span{width:100%;height:100%;border-radius:50%;background:#0b0a12;display:grid;place-items:center;overflow:hidden}
.fbar .fb-av img{width:100%;height:100%;object-fit:cover}
.fbar b{font-size:13px;font-weight:800}
.fbar .fb-syn{font-size:10.5px;color:var(--mut);direction:ltr;unicode-bidi:isolate}
.fbar .fb-sp{margin-inline-start:auto}
.fbtn{border:1px solid rgba(10,132,255,.45);background:rgba(10,132,255,.16);color:var(--blue2);border-radius:11px;
  padding:6px 11px;font-size:12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fbtn.ghost{border-color:var(--line);background:var(--soft);color:var(--tx)}
.fbtn:disabled{opacity:.55;cursor:progress}
.fbar a.extl,.pfoot a.extl{color:var(--blue2);text-decoration:none;font-weight:800;font-size:11.5px}
.pact a.extl{display:inline-flex;align-items:center;color:#fff}
.cap .clamp.no{display:block;-webkit-line-clamp:initial;overflow:visible}
.fend{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
@keyframes spin{to{transform:rotate(360deg)}}
.fbtn.busy svg{animation:spin 1.1s linear infinite}

/* استوری‌ها */
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,.08)}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:64px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff}
.story .ring{width:60px;height:60px;border-radius:50%;padding:2.5px;background:conic-gradient(from 160deg,#f9ce34,#ee2a7b,#8a3ab9,#4c5fd7,#f9ce34)}
.story.seen .ring{background:rgba(255,255,255,.22)}
.story .ring>span{display:block;width:100%;height:100%;border-radius:50%;border:2px solid #0b0a12;overflow:hidden;background:#15131f}
.story img{width:100%;height:100%;object-fit:cover;display:block}
.story em{font-style:normal;font-size:10.5px;color:rgba(255,255,255,.8);max-width:64px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* پست‌ها */
.post{padding:12px 0 4px;border-bottom:1px solid rgba(255,255,255,.08)}
.post:last-child{border-bottom:0}
.post-top{display:flex;align-items:center;gap:9px;padding-bottom:10px}
.post-top .u{font-size:13px;font-weight:800}
.post-top .t{font-size:11px;color:var(--mut);margin-inline-start:auto;direction:ltr}
.post-media{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:var(--igRatio);cursor:pointer}
.post-media img{transition:transform .35s var(--ease)}
.post-media:active img{transform:scale(.985)}
.post-media img{width:100%;height:100%;object-fit:cover;display:block}
.pm-multi{position:absolute;top:9px;inset-inline-end:9px;background:rgba(0,0,0,.6);border-radius:8px;
  font-size:10.5px;padding:3px 8px;direction:ltr;backdrop-filter:blur(8px)}
.dots{position:absolute;bottom:9px;inset-inline:0;display:flex;justify-content:center;gap:4px;pointer-events:none}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots i.on{background:#fff;transform:scale(1.25)}
.heart-burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;font-size:74px;color:#fff;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.55))}
.post-media.burst .heart-burst{animation:burst .8s var(--ease)}
@keyframes burst{0%{opacity:0;transform:scale(.4)}25%{opacity:.95;transform:scale(1.1)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
.pact{display:flex;align-items:center;gap:16px;padding:10px 2px 2px;font-size:20px}
.pact button{background:none;border:0;color:#fff;font-size:20px;line-height:1;padding:2px;transition:.15s}
.pact button:active{transform:scale(.86)}
.pact .cnt{font-size:12px;font-weight:800;margin-inline-start:6px}
.pact .like.on{color:var(--red)}
.pact .sp{margin-inline-start:auto}
.cap{font-size:13px;line-height:1.85;margin:8px 0 0;white-space:pre-wrap;word-break:break-word}
.cap clamp,.cap .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap small{display:block;color:var(--mut);font-size:11px;margin-top:3px}
.capmore{background:none;border:0;color:var(--blue2);font-weight:800;font-size:12px;padding:4px 0 0;cursor:pointer}
.pfoot{display:flex;align-items:center;gap:10px;padding:2px 2px 12px;font-size:11px;color:var(--mut)}
.pfoot b{color:var(--tx);font-weight:800;font-size:11.5px}
.pfoot .sp{margin-inline-start:auto}
.fend{text-align:center;padding:14px 2px 4px}
.fend a{color:var(--blue2);font-weight:800;font-size:12.5px;text-decoration:none}
.pcap{font-size:13px;line-height:1.95;color:rgba(255,255,255,.84);padding:4px 2px 0;white-space:pre-line}
.pcap b{color:#fff;font-weight:800;margin-inline-end:6px}
.pmore{background:none;border:0;color:var(--mut);font-size:12px;padding:2px}
.pstat{font-size:12px;color:rgba(255,255,255,.72);padding:8px 2px 2px;font-weight:700}
.pcom{display:flex;flex-direction:column;gap:7px;padding:6px 2px 2px}
.cmt{display:flex;gap:8px;font-size:12.5px;line-height:1.75}
.cmt .ca{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800;
  background:linear-gradient(135deg,rgba(10,132,255,.4),rgba(168,85,247,.4))}
.cmt .cb{flex:1;min-width:0}
.cmt .cb b{font-weight:800;font-size:12px}
.cmt .cw{font-size:10.5px;color:var(--mut);margin-inline-start:6px}
.cmt-form{display:flex;gap:7px;align-items:center;padding:8px 0 2px}
.cmt-form input{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;
  padding:9px 14px;color:#fff;font-size:12.5px;outline:none;font-family:inherit}
.cmt-form input:focus{border-color:var(--blue)}
.cmt-form button{flex:none;background:none;border:0;color:var(--blue);font-size:12.5px;font-weight:800}

/* ================= استوری‌نمایش ================= */
.slayer{position:fixed;inset:0;z-index:260;background:#000;display:none;place-items:center}
.slayer.open{display:grid}
.slayer-inner{width:100%;max-width:430px;height:100%;max-height:100vh;position:relative;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 22%,transparent 70%,rgba(0,0,0,.7))}
.sbars{display:flex;gap:4px;padding:12px 12px 0}
.sbars i{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.sbars i b{display:block;height:100%;width:0;background:#fff}
.sbars i.done b{width:100%}
.sbars i.run b{animation:srun 5s linear forwards}
@keyframes srun{to{width:100%}}
.shead{display:flex;align-items:center;gap:9px;padding:10px 12px}
.shead .n{font-size:13px;font-weight:800}
.shead .x{margin-inline-start:auto;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:14px}
.simg{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
.simg img{width:100%;height:100%;object-fit:contain}
.scap{padding:12px 16px calc(18px + env(safe-area-inset-bottom));font-size:13px;color:rgba(255,255,255,.9);line-height:1.9}
.szone{position:absolute;inset:0;display:flex}
.szone span{flex:1}

/* ================= گفتگو: فایل ================= */
.attach{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.07);border:1px dashed var(--line);
  border-radius:16px;padding:9px 11px}
.attach img{width:46px;height:46px;border-radius:11px;object-fit:cover;flex:none}
.attach .an{flex:1;min-width:0;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach .as{font-size:11px;color:var(--mut);direction:ltr}
.attach .ax{width:30px;height:30px;flex:none;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:12px}
.msg-file{display:flex;gap:9px;align-items:center;margin-top:8px;background:rgba(0,0,0,.22);border-radius:13px;padding:8px}
.msg-file img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none}
.msg-file .fchip{width:42px;height:42px;border-radius:11px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.14);font-size:17px}
.msg-file .fn{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.msg-file .fs{font-size:10.5px;opacity:.75;direction:ltr}
.msg-file a{color:#fff;flex:none;font-size:15px;margin-inline-start:auto}
.c-attach{width:46px;height:46px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;font-size:17px;padding:0}
.reply-tag{font-size:10.5px;color:var(--green);font-weight:800}

/* ================= ورود ادمین ================= */
.log-sheet{position:absolute;inset-inline:0;bottom:0;max-width:430px;margin:0 auto;background:rgba(16,14,24,.97);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid var(--line);border-bottom:0;
  border-radius:26px 26px 0 0;padding:16px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(101%);
  transition:transform .3s var(--ease);display:flex;flex-direction:column;gap:10px}
.log-wrap.open .log-sheet{transform:none}
.log-sheet h3{font-size:17px;font-weight:800}
.log-sheet input{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  color:#fff;font-size:14px;outline:none;font-family:inherit;width:100%}
.log-sheet input:focus{border-color:var(--blue)}
.log-err{font-size:12px;color:var(--red);min-height:16px}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.who b{color:#fff;font-size:12.5px}
.adm-out{border:1px solid rgba(255,69,58,.4);background:rgba(255,69,58,.14);color:#ffb3ae;border-radius:11px;
  padding:6px 11px;font-size:12px;font-weight:700}

/* ================= صندوق و ادمین‌ها ================= */
.inbox-item{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:16px;padding:11px}
.inbox-item .ii{flex:1;min-width:0}
.inbox-item .meta{font-size:11px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;direction:ltr}
.inbox-item .txt{font-size:12.5px;line-height:1.85;margin-top:5px;white-space:pre-line}
.inbox-item img{max-width:120px;border-radius:10px;margin-top:7px;display:block}
.pill{font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:rgba(255,255,255,.08)}
.pill.ok{border-color:rgba(48,209,88,.4);background:rgba(48,209,88,.14);color:var(--green)}
.pill.no{border-color:rgba(255,159,10,.4);background:rgba(255,159,10,.14);color:var(--yellow)}
.rep-form{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.rep-form textarea{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:11px;padding:9px 11px;
  color:#fff;font-size:12.5px;font-family:inherit;min-height:64px;resize:vertical;outline:none}
.rep-form textarea:focus{border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sect-h{font-size:12px;font-weight:800;color:rgba(255,255,255,.8);margin-top:4px}

/* ---------- پیمایش قاب تک‌پستی + آیکون‌ها ---------- */
.ig-pager{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 0 2px}
.ig-pager .pg{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.07);
  color:#fff;display:grid;place-items:center;font-size:13px;padding:0;transition:.18s var(--ease)}
.ig-pager .pg:hover{background:rgba(255,255,255,.16)}
.ig-pager .pg:active{transform:scale(.9)}
.ig-pager .pgc{font-size:11.5px;color:var(--mut);direction:ltr;display:flex;align-items:center;gap:6px}
.ig-pager .pgc i{font-style:normal;direction:rtl}
.ig-hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--faint);
  padding:9px 0 2px;border-top:1px solid rgba(255,255,255,.07);margin-top:10px}
.pact{gap:11px}
.pact button{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:rgba(255,255,255,.92);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);transition:.18s var(--ease)}
.pact button:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.pact button:active{transform:scale(.9)}
.pact .cnt{margin-inline-start:2px;color:var(--mut);font-size:12px;font-weight:800}
.pact .like.on{color:#ff5f57;background:rgba(255,69,58,.16);border-color:rgba(255,69,58,.42);
  box-shadow:0 6px 18px rgba(255,69,58,.28)}
.pact .like.on svg{transform:scale(1.1)}
.pact .like svg,.pact button svg{transition:transform .2s var(--ease)}
.pact [data-dl]:hover{color:var(--blue2);border-color:rgba(10,132,255,.4)}
.lb-btn{position:relative}
#lbActions button{width:40px;height:40px;border-radius:13px}

/* ---------- انیمیشن ورود کارت‌ها ---------- */
.view.active .sec,.view.active .stat{animation:secIn .5s var(--ease) both}
.view.active .sec:nth-child(2){animation-delay:.05s}
.view.active .sec:nth-child(3){animation-delay:.1s}
.view.active .sec:nth-child(4){animation-delay:.15s}
.view.active .sec:nth-child(5){animation-delay:.2s}
.view.active .sec:nth-child(6){animation-delay:.25s}
@keyframes secIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- انگلیسی / چپ‌به‌راست ---------- */
html[dir=ltr] body{line-height:1.7}
html[data-lang=en] .hero-name{letter-spacing:.01em}
html[data-lang=en] .ios-brand-name{letter-spacing:-.02em}

/* ---------- دسکتاپ: قاب گوشی ---------- */
/* ---------- واکنش‌گرایی: تبلت و دسکتاپ (چیدمان واقعی، نه قاب گوشی) ---------- */

  body{display:block;padding:0;min-height:100vh;min-height:100dvh}
  #app{width:auto;display:block}
  .shell{max-width:860px;min-height:100dvh;height:auto;padding:0 0 26px;border:0;border-radius:0;
    box-shadow:none;background:transparent;overflow:visible}
  .ios-statusbar,.home-indicator{display:none}
  .ios-topbar{padding:18px 22px 6px}
  .ios-main{padding:4px 22px 0}
  .ios-appbar{top:0;padding:14px 18px 10px}
  .ios-bottom{position:sticky;bottom:14px;max-width:560px;padding:6px 12px;background:none}
  .ios-dock{gap:10px;padding:10px 14px;margin-bottom:0;border-radius:26px}
  .app-ic .ic{width:48px;height:48px;border-radius:14px}
  .app-ic .lbl{font-size:10.5px}
  .view#view-home{padding-bottom:20px}
  .ios-card{border-radius:26px}
  .hero{padding:26px 24px 20px}
  .hero-name{font-size:29px}
  .ios-card.studio{padding:16px 20px 18px}
  .hstats{gap:10px}

      var h={'Accept':'application/json'};
      if(API.tok)h['X-TA-Token']=API.tok;
      var o={method:method||(body!=null?'POST':'GET'),cache:'no-store',headers:h};
      if(body!=null){h['Content-Type']='application/json';o.body=JSON.stringify(body)}
      fetch(apiPath()+'?action='+action,o).then(function(r){

        if(ct.indexOf('json')<0){var er=new Error('not-json');er.status=r.status;throw er}
        return r.json().then(function(j){j=j||{};j.__status=r.status;res(j)})

    }catch(e){rej(e)}

}

function apiQueuePush(){if(!API.on||!isAuth())return;clearTimeout(pushT);pushT=setTimeout(function(){apiPush(false,null,true)},1500)}
function apiPush(force,cb,bg){
  if(!API.on){toast(isFa()?'بک‌اند سرور فعال نیست — ذخیره فقط در این مرورگر ماند':'No server backend — saved locally');if(cb)cb({ok:false});return}
  API.pushState='busy';
  var body={data:D};
  if(!force&&API.rev>=0)body.baseRev=API.rev;
  taCall('content',body).then(function(j){
    API.pushState='idle';
    if(j&&j.ok){API.rev=Number(j.rev)||API.rev;API.conflict=false;toast(isFa()?'روی سرور هم ذخیره شد ✓ (rev '+num(API.rev)+')':'Synced to server ✓')}
    else if(j&&(j.conflict||j.__status===409)){
      API.rev=Number(j.rev)||API.rev;
      if(bg){API.conflict=true;toast(isFa()?'روی سرور نسخهٔ تازه‌تری است — برای تصمیم به تب همگام‌سازی سرور بروید (محتوای شما محلی محفوظ است)':'Server has a newer revision — decide in the Sync tab');
        if(W)renderAdmin();if(cb)cb(j);return}
      var m=isFa()?'نسخهٔ سرور تازه‌تر است (rev '+num(API.rev)+').\n\n«تأیید» = برداشتن نسخهٔ سرور (تغییرات شما می‌رود)\n«لغو» = فرستادن نسخهٔ شما و بازنویسی سرور'
                   :'The server has a newer revision (rev '+num(API.rev)+'). OK = take the server version, Cancel = overwrite it.';
      var take=true;try{take=window.confirm(m)}catch(e){}
      if(take){if(j.data)apiAdopt(j.data);toast(isFa()?'نسخهٔ سرور بارگذاری شد ✓':'Server version loaded ✓')}
      else apiPush(true);
    } else toast((j&&j.error)||isFa()?'خطای سرور':'Server error');
    if(cb)cb(j);
  }).catch(function(e){API.pushState='idle';API.lastErr='push';toast(isFa()?'ارتباط با سرور برقرار نشد ❌':'Server unreachable')});
}
function apiSend(text,file){
  var body={sid:D.sid,text:text||'',to:(D.profile&&D.profile.name)||'titanali',name:WHO.name||'',phone:whoPhone(WHO.phone)};
  if(file)body.file={id:file.id||'',name:file.name,type:file.type,size:file.size};
  return taCall('send',body).catch(function(){return {ok:false,error:'net'}});
}
function apiPollThread(silent){
  if(!API.on||!D.sid)return;
  taCall('thread&sid='+encodeURIComponent(D.sid)).then(function(j){
    if(!j||!j.ok)return;
    var have={};D.messages.forEach(function(m){if(m.mid)have[m.mid]=1});
    var add=(j.messages||[]).filter(function(m){return m.mid?!have[m.mid]:true});
    if(!add.length)return;
    add.forEach(function(m){D.messages.push({me:false,text:m.text,ts:m.ts,mid:m.mid,name:m.name,them:true})});
    save();renderChatFull();
    if(!silent)toast(isFa()?'پاسخ کارگاه رسید ✉':'Reply from the atelier ✉');
  }).catch(function(){});
}
function apiWatch(){if(API.timer)return;API.timer=setInterval(function(){if(CUR==='chat'||!document.hidden)apiPollThread(true)},45000)}
function apiUpload(name,type,dataUrl,w,h,cb){
  if(!API.on){cb(null);return}
  taCall('upload',{name:name,type:type,data:String(dataUrl||'').split(',').pop()||''}).then(function(j){
    cb(j&&j.ok?j:null)
  }).catch(function(){cb(null)})
}

/* ---------- هویت کاربر گفتگو: نام + شماره تلفن ---------- */
var WHOKEY='titanali.who',WHO={name:'',phone:''};
function whoPhone(v){
  return String(v==null?'':v)
    .replace(/[\u06f0-\u06f9]/g,function(x){return String(x.charCodeAt(0)-0x06f0)})
    .replace(/[\u0660-\u0669]/g,function(x){return String(x.charCodeAt(0)-0x0660)})
    .replace(/\D/g,'').slice(0,15)}
function whoComplete(){
  if(needName()&&WHO.name.replace(/\s/g,'').length<2)return false;
  if(needPhone()&&WHO.phone.length<10)return false;
  return true}
function telHref(p){p=String(p||'').replace(/[^\d+]/g,'');
  if(/^0\d{9,10}$/.test(p))p='98'+p.slice(1);
  else if(/^9\d{9}$/.test(p))p='98'+p;
  if(/^\+980\d/.test(p))p='+'+p.slice(4);
  return 'tel:'+(p.charAt(0)==='+'?p:'+'+p)}
function whoDisp(v){
  var d=whoPhone(v);
  if(d.length===11)d=d.replace(/^(\d{4})(\d{3})(\d{4})$/,'$1 $2 $3');
  else if(d.length===10)d=d.replace(/^(\d{4})(\d{6})$/,'$1 $2');
  else if(d.length>11)d=d.replace(/(?=(\d{4})+(?!\d))/g,' ');
  return d.replace(/\d/g,function(x){return '۰۱۲۳۴۵۶۷۸۹'[+x]})}
function needPhone(){return !(D.settings&&D.settings.needPhone===0)}
function needName(){return !(D.settings&&D.settings.needName===0)}
function whoLoad(){
  try{var o=JSON.parse(localStorage.getItem(WHOKEY)||'null');
    if(o&&typeof o==='object'){WHO.name=String(o.name||'').slice(0,60);WHO.phone=String(o.phone||'').slice(0,15)}}catch(e){}
}
function whoSave(){try{localStorage.setItem(WHOKEY,JSON.stringify(WHO))}catch(e){}}
function whoFill(){
  var n=$('#whoName'),ph=$('#whoPhone');
  if(n&&!n.value)n.value=WHO.name;
  if(ph&&!ph.value)ph.value=WHO.phone;
}
function whoRead(){
  var n=$('#whoName'),ph=$('#whoPhone');
  if(n)n.classList.remove('bad');if(ph)ph.classList.remove('bad');
  if(n)WHO.name=String(n.value||'').replace(/\s+/g,' ').trim().slice(0,60);
  if(ph)WHO.phone=whoPhone(ph.value);
  whoSave();renderWho();
  return WHO.name!==''||WHO.phone!=='';
}
function renderWho(){
  var bar=$('#whoBar'),done=$('#whoDone');if(!bar||!done)return;
  whoFill();
  var complete=whoComplete(),has=!!(WHO.name||WHO.phone);
  bar.hidden=complete;done.hidden=!(complete&&has);
  if(complete&&has){
    $('#whoDoneName').textContent=WHO.name||'بدون نام';
    var a=$('#whoDonePhone');
    if(WHO.phone){a.textContent=whoDisp(WHO.phone);a.setAttribute('href',telHref(WHO.phone))}
    else{a.textContent='شماره‌ای نداده‌اید';a.removeAttribute('href')}}
  var nt=$('#whoNote');
  if(nt)nt.textContent=needPhone()?t('chat.whoReq'):t('chat.whoOpt');
  var hp=$('#whoPhoneLbl');
  if(hp)hp.textContent=t('chat.phone')+(needPhone()?'':' ('+t('chat.whoOpt')+')')
}
function renderChat(){renderChatFull()}
function sendGate(){
  whoRead();
  if(whoComplete()){var b1=$('#whoBar');if(b1&&!b1.hidden)b1.hidden=true;renderWho();return true}
  if(needName()&&WHO.name.replace(/\s/g,'').length<2){
    bar0();var el=$('#whoName');if(el){el.focus();el.classList.add('bad')}toast(t('chat.noName'));return false}
  if(needPhone()&&WHO.phone.length<10){
    bar0();var pe=$('#whoPhone');if(pe){pe.focus();pe.classList.add('bad')}toast(t('chat.noPhone'));return false}
  return true;
}
function bar0(){var b=$('#whoBar');if(b){b.hidden=false;var d=$('#whoDone');if(d)d.hidden=true}}
function sendChat(){
  var ta=$('#chatText'),v=ta.value.trim();
  if(!v&&!PFILE){toast(isFa()?'متن یا فایل را بفرستید':'Write a text or attach a file');return}
  if(!sendGate())return;
  var fl=PFILE;
  var wtag={name:WHO.name,phone:WHO.phone};
  D.messages.forEach(function(m){if(m.me&&!m.who)m.who=wtag});
  var mine={me:true,text:v,ts:Date.now(),file:fl||undefined,sid:D.sid,who:wtag};
  D.messages.push(mine);
  if(W)W.messages=(W.messages||[]).concat([mine]);   /* پنلِ باز: صندوق بی‌دریغ پیام‌های تازه را ببیند */
  PFILE=null;renderPending();ta.value='';ta.style.height='auto';
  save();renderChatFull();
  if(API.on){
    var mine=D.messages[D.messages.length-1];
    apiSend(v,fl).then(function(j){
      if(j&&j.ok){
        if(j.mid)mine.mid=j.mid;
        if(j.sid&&j.sid!==D.sid){D.sid=j.sid;try{localStorage.setItem('titanali.sid',D.sid)}catch(e){}}
        save();
        toast(isFa()?'پیام به کارگاه رسید ✓ پاسخ در همین گفتگو می‌آید':'Sent ✓ the reply will appear here');
      } else toast((j&&j.error&&j.error!=='net')?j.error:isFa()?'سرور پاسخ نداد — پیام محلی ماند':'Server unreachable — kept locally');
      setTimeout(function(){apiPollThread(true)},1200);
    });
    return;
  }
  setTimeout(function(){
    D.messages.push({me:false,text:isFa()
      ?'پیامت ثبت شد ✓ برای ارسال واقعی، دکمهٔ تلگرام یا واتساپ را بزن.'
      :'Saved locally ✓ Tap Telegram or WhatsApp to actually send it.',ts:Date.now(),sid:D.sid});
    save();renderChatFull();
  },900);
}
function sendVia(kind){
  var txt=$('#chatText').value.trim()||(isFa()?'سلام! برای ':'Hi! ');
  var c=D.contacts.filter(function(x){return x.kind===kind})[0];
  if(!c){toast(isFa()?'این راه ارتباطی در تماس‌ها نیست':'Contact not configured');return}
  var url='';

  if(!ts)return 'تازه';
  var s=Math.max(1,Math.floor((Date.now()-ts)/1000)),v=0,u='second';
  if(s<60){v=s}else if(s<3600){v=Math.floor(s/60);u='minute'}
  else if(s<86400){v=Math.floor(s/3600);u='hour'}
  else if(s<2592000){v=Math.floor(s/86400);u='day'}
  else {v=Math.floor(s/2592000);u='month'}
  try{return new Intl.RelativeTimeFormat(loc(),{numeric:'auto'}).format(-v,u)}catch(e){return v+' '+u}
}

/* تلاش از مرورگر (معمولاً CORS می‌خورد؛ فقط وقتی سرور نیست مفید است) */
function igSyncFromBrowser(){
  var u=igUser(),tried=0;
  igSyncNote('⏳ '+esc(tx('ig.busy')));
  function fail(msg){
    igSyncNote('⚠️ '+esc(msg||tx('ig.fail')));
    if(API.on)toast(tx('ig.fail'));
  }
  ['https://i.instagram.com/api/v1/feed/user/?username='+encodeURIComponent(u),
   'https://www.instagram.com/'+encodeURIComponent(u)+'/?__a=1&__d=dis'].forEach(function(url){
    tried++;
    fetch(url,{mode:'cors'}).then(function(r){return r.json()}).then(function(j){
      if(j&&j.items)igApplyFeed(j.items.map(function(m){return {
        id:m.pk||m.id,image_url:(m.image_versions2&&m.image_versions2.candidates&&m.image_versions2.candidates[0].url)||m.image_url,
        caption:typeof m.caption==='string'?m.caption:((m.caption&&m.caption.text)||''),
        likes:m.like_count||0,comments:m.comment_count||m.num_comments||0,
        link:'https://www.instagram.com/p/'+(m.code||m.shortcode||'')+'/',date:m.taken_at?new Date(m.taken_at*1000).toISOString().slice(0,10):''
      }}),'browser');
      else if(j&&j.data&&j.data.user&&j.data.user.media)igApplyFeed(j.data.user.media.nodes,'browser');
      else throw 0;
    }).catch(function(){if(--tried===0)fail(tx('ig.fail'))});
  });
  setTimeout(function(){if(tried>0)fail(tx('ig.fail'))},6000);
}
function igApply(items,T){

    var g={t:(cap.split('\n')[0]||('پست '+(D.gallery.length+1))).slice(0,60),cat:'',desc:cap.slice(0,400),img:src,imgs:[],
      comments:[],likes:m.like_count||m.num_likes||0,dl:0,n:0,ts:(m.taken_at?a(m.taken_at):Date.now())};
    function a(x){return (Number(x)||0)*1000}

  });

function igApplyJson(text){

}

function localGroups(M){
  var groups={},order=[];
  (M.messages||[]).forEach(function(m,ix){
    if(m.to!=null&&!m.me)return;              /* پاسخ ادمین کنار پیام خودش می‌آید */
    if(!m.me)return;
    var k='l:'+(m.sid||'local');
    if(!groups[k]){groups[k]={key:k,items:[],name:'',phone:'',last:0,answered:false,n:0};order.push(k)}
    groups[k].items.push({m:m,ix:ix});groups[k].n++;
    groups[k].last=Math.max(groups[k].last,Number(m.ts)||0);
    var w=m.who||{};
    if(w.name)groups[k].name=w.name;
    if(w.phone)groups[k].phone=w.phone;
  });
  (M.messages||[]).forEach(function(m,ix){
    if(m.me||m.to==null)return;
    var src=M.messages[m.to],k='l:'+((src&&src.sid)||'local');
    if(!groups[k])return;
    groups[k].reps=groups[k].reps||[];groups[k].reps.push({m:m,ix:ix});
    groups[k].answered=true;groups[k].n++;groups[k].last=Math.max(groups[k].last,Number(m.ts)||0);
  });
  if(!order.length)return '';
  return order.map(function(k){
    var g=groups[k],h='',imgs=[];

function apiInstall(){

  if(pw.length<8){toast(isFa()?'رمز سرور حداقل ۸ کاراکتر ❌':'Password too short');return}
  taCall('install',{u:uu,p:pw,name:nm?String(nm.value).trim():'',data:D}).then(function(j){
    if(j&&j.ok&&j.token){apiTok(j.token);SESS={u:j.user,name:j.name,server:true};
      try{sessionStorage.setItem('titanali.sess',JSON.stringify(SESS))}catch(e){}
      API.setup=false;API.conflict=false;API.rev=Number(j.rev)||0;
      admWhoLine();toast(j.msg||'نصب شد ✓');renderAdmin();
    } else toast((j&&j.error)||isFa()?'نصب نشد ❌':'Install failed');
  }).catch(function(){toast(isFa()?'سرور پاسخ نداد ❌':'Server unreachable')});

function apiAdminPush(setPw){
  if(!API.on||!isAuth()){toast(isFa()?'ابتدا روی سرور نصب و وارد شوید':'Install and sign in first');return}
  var err='';
  taCall('admins').then(function(j){
    var cur=(j&&j.ok&&j.admins)||[],map={};cur.forEach(function(a){map[a.u]=a});
    API.serverAdmins=cur;
    var list=((W&&W.admins)||D.admins||[]).filter(function(a){return a&&a.u});
    var chain=Promise.resolve(),n=0;
    function push(o){chain=chain.then(function(){return taCall('admins',o).then(function(r){
      if(r&&r.ok)n++; else err=(r&&r.error)||'خطای سرور';return r})})}
    list.forEach(function(a){
      if(!map[a.u])push({op:'add',u:a.u,p:a.p||'',name:a.name||a.u});
      else if(setPw&&a.p)push({op:'pw',u:a.u,p:a.p});
    });
    cur.forEach(function(a){ if(!list.some(function(x){return x.u===a.u}))push({op:'remove',u:a.u}) });
    return chain;
  }).then(function(){
    if(n||err)toast(err?('آخرین خطا: '+err):('ادمین‌ها روی سرور به‌روز شد ✓ ('+num(n)+' تغییر)'));
    else toast(isFa()?'ادمین‌ها هم‌سان است ✓':'In sync');
    if(W){W=clone(D);renderAdmin()}
  }).catch(function(){toast(isFa()?'همگام‌سازی ادمین‌ها نشد ❌':'Failed')});
}
function apiBtn(k){
  if(k==='test'){
    toast(isFa()?'در حال بررسی…':'Checking…');
    taCall('health').then(function(j){
      if(j&&j.app==='titanali'){API.on=true;API.setup=!!j.needSetup;API.writable=j.writable!==false;API.php=j.php||'';API.rev=Number(j.rev)||0;
        toast(isFa()?'اتصال برقرار ✓ (rev '+num(API.rev)+')':'Connected ✓');
        apiRefresh(function(){if(W){W=clone(D);renderAdmin()}});
      } else toast(isFa()?'api.php پاسخ JSON نداد — PHP روی هاست فعال است؟':'api.php did not return JSON — is PHP enabled?');
    }).catch(function(){API.on=false;toast(isFa()?'سرور پیدا نشد ❌':'Server not found');if(W)renderAdmin()});
    return;
  }
  if(k==='pull'){
    taCall('content').then(function(j){
      if(j&&j.ok&&j.data){apiSocial(j.social);API.rev=Number(j.rev)||API.rev;API.updated=Number(j.updated)||0;
        apiAdopt(j.data);W=clone(D);renderAdmin();toast(isFa()?'نسخهٔ سرور بارگذاری شد ✓ (rev '+num(API.rev)+')':'Pulled ✓');
      } else toast(isFa()?'محتوایی روی سرور نیست':'No content on the server');
    }).catch(function(){toast(isFa()?'سرور پاسخ نداد ❌':'Server unreachable')});
    return;
  }
  if(k==='push'){apiPush(true);return}
  if(k==='inbox'){apiThreads(function(){toast(API.threads?(num(API.threads.length)+' گفتگو از سرور گرفته شد ✓'):'سرور پاسخ نداد ❌');if(W)renderAdmin()});return}
  if(k==='export'){
    taCall('export').then(function(j){
      if(!j||!j.ok){toast((j&&j.error)||isFa()?'خطا':'Error');return}
      try{
        var blob=new Blob([JSON.stringify(j,null,2)],{type:'application/json'});
        var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='titanali-server.json';
        document.body.appendChild(a);a.click();
        setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},300);
        toast(isFa()?'خروجی کامل دانلود شد ✓':'Export downloaded');
      }catch(e){toast(isFa()?'دانلود نشد ❌':'Download failed')}
    }).catch(function(){toast(isFa()?'سرور پاسخ نداد ❌':'Server unreachable')});
    return;
  }
  if(k==='logout'){taCall('logout',{t:API.tok});apiTok('');toast(isFa()?'نشست سرور بسته شد':'Server session closed');if(W)renderAdmin();return}
  if(k==='install'){apiInstall();return}
  if(k==='pushpw'){apiAdminPush(true);return}
}

function apiPublish(quiet,cb){
  if(!API.on){if(!quiet)toast(isFa()?'بک‌اند تنظیم نشده — تغییرات فقط در همین مرورگر است':'Backend not configured');if(cb)cb(false);return}
  if(!isAuth()){if(!quiet)toast(isFa()?'اول وارد پنل شوید':'Sign in first');if(cb)cb(false);return}
  PUB.busy=true;refreshPills();
  var btn=$('#admPublish');if(btn)btn.classList.add('busy');
  taCall('publish',{data:clone(D),baseRev:API.rev}).then(function(j){
    PUB.busy=false;var b=$('#admPublish');if(b)b.classList.remove('busy');
    if(j&&j.ok){
      API.rev=Number(j.rev)||API.rev;API.published=API.rev;API.conflict=false;
      var p=j.publish||{};PUB.lastAt=Date.now();PUB.lastRev=API.rev;PUB.file=p.file||'';PUB.bytes=Number(p.bytes)||0;PUB.err=p.error||'';
      W=clone(D);renderAdmin();refreshPills();
      if(PUB.err==='off'){if(!quiet)toast(isFa()?'محتوا روی سرور ذخیره شد (فایل ایستا در config خاموش است)':'Saved on server (static file off)')}
      else if(!quiet)toast(isFa()?'منتشر شد ✓  rev '+num(API.rev)+(PUB.bytes?' · '+kb(PUB.bytes):''):'Published ✓')
    }else if(j&&j.conflict){
      API.conflict=true;API.rev=Number(j.rev)||API.rev;refreshPills();
      toast(isFa()?'⚠ روی سرور تغییر تازه‌تری هست — اول «گرفتن از سرور»':'⚠ Server has newer content — pull first');
    }else{toast((j&&j.error)||(isFa()?'انتشار نشد ❌':'Publish failed'))}
    if(cb)cb(!!(j&&j.ok));
  }).catch(function(){PUB.busy=false;var b=$('#admPublish');if(b)b.classList.remove('busy');refreshPills();
    toast(isFa()?'سرور پاسخ نداد — تغییرات محلی ماند':'Server unreachable');if(cb)cb(false)});
}
function pubRefresh(cb){
  if(!API.on||!isAuth()){PUB.state=null;if(cb)cb();return}
  taCall('state').then(function(j){
    if(j&&j.ok){PUB.state=j;PUB.lastRev=Number(j.rev)||0;PUB.rev=j.rev;
      PUB.lastAt=(j.publish&&Number(j.publish.at)*1000)||0;PUB.file=(j.publish&&j.publish.file)||'';
      PUB.bytes=(j.publish&&Number(j.publish.bytes))||0;PUB.err=(j.publish&&j.publish.error)||'';
      API.rev=PUB.lastRev;API.published=PUB.lastRev;
      var bk=j.baked||{};PUB.baked=bk;
      if(bk&&bk.exists&&bk.rev)API.rev=Math.max(API.rev,0);
    }
    refreshPills();
    if(admTab==='publish')renderAdmin();
    if(cb)cb();
  }).catch(function(){PUB.state=null;refreshPills();if(cb)cb()});
}

  if(k==='igsync'){igSyncFromServer(true);return}

        link:x.permalink||x.link||'',date:ds,user:x.username||x.user||igUser()};
    }),'json');

  }

}

/* کوچک و فشرده‌کردن تصویر در مرورگر، قبل از ذخیره در localStorage */
function shrink(file,cb,mxIn,qIn){
  if(!file||!/^image\//.test(file.type||'')){toast('فقط فایل تصویری');return}
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var mx=mxIn||1100,sc=Math.min(1,mx/Math.max(im.width,im.height));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      var url=c.toDataURL('image/jpeg',0.85);
      cb(url,c.width,c.height,Math.round(url.length*0.75));
    };
    im.onerror=function(){toast('این فایل خوانده نشد ❌')};
    im.src=r.result;
  };
  r.onerror=function(){toast('خواندن فایل ممکن نشد ❌')};
  r.readAsDataURL(file);
}
function setDesignImg(i,url){
  if(!W.gallery[i])return;
