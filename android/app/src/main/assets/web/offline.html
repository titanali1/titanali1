<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050409">
<title>اتصال ندارد — تیتانلی</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:26px;font-family:-apple-system,"Segoe UI",Vazirmatn,Tahoma,sans-serif;
  background:#050409;color:#fff;text-align:center}
main{max-width:420px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:26px 20px 22px;
  box-shadow:0 18px 50px rgba(0,0,0,.45)}
.ic{font-size:38px;line-height:1}
h1{font-size:19px;margin:12px 0 6px;font-weight:800}
p{font-size:13.5px;line-height:1.95;color:rgba(255,255,255,.66);margin:0 0 16px}
button{width:100%;border:0;border-radius:16px;padding:13px 16px;font-size:14.5px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#0a84ff,#4da6ff);font-family:inherit}
button:active{transform:scale(.98)}
a{color:#4da6ff;text-decoration:none;font-size:12.5px;display:inline-block;margin-top:12px}
ul{text-align:start;font-size:12.5px;line-height:1.95;color:rgba(255,255,255,.55);margin:14px 0 0;padding-inline-start:18px}
</style>
</head>
<body>
<main>
  <div class="ic">📡</div>
  <h1>اتصال اینترنت برقرار نیست</h1>
  <p>طرح‌ها و متن‌های ذخیره‌شده روی همین گوشی کار می‌کنند؛ برای دیدن تازه‌ها، دریافت پاسخ پیام‌ها یا ارسال سفارش، اتصال را وصل کنید.</p>
  <button type="button" onclick="location.replace('index.html')">تلاش دوباره</button>
  <ul>
    <li>پیام‌ها و پیش‌نویس‌های محلی‌تان حفظ شده‌اند.</li>
    <li>با وصل شدن اینترنت، صفحهٔ «گفتگو» را باز کنید تا پاسخ کارگاه بیاید.</li>
  </ul>
  <a href="tel:+989120000000">تماس با کارگاه</a>
</main>
</body>
</html>
