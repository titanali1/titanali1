# titanali — تنظیمات build
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# AGP — اگر Android Studio نسخهٔ تازه‌تر خواست، همین‌جا بالا ببرید
agpVersion=8.11.1

# ───────── چیدمان برنامه (یک‌جا همین‌جا عوض کنید) ─────────
# شناسهٔ بسته. برای گوگل‌پلی و مایکت باید یکتا و متعلق به خودتان باشد.
titanali.appId=ir.titanali1.app
# نسخه‌ها: versionCode همیشه باید در هر انتشار تازه‌تر (بزرگ‌تر) باشد.
# فرمول: major*10000 + minor*100 + patch  →  1.0.8 = 10008
titanali.versionName=1.0.10
titanali.versionCode=10010
# مبدأ ساختگیِ پوسته (برای serving فایل‌های آفلاین با origin سالم + CORS)
titanali.appHost=app.titanali1.ir
# آدرس سایت و بک‌اند — داخل اپ به window.TITANALI_SITE / TITANALI_API تزریق می‌شود
titanali.site=https://titanali1.ir/
titanali.api=https://titanali1.ir/api.php
# true = اول سایت زنده را باز کن (همیشه تازه)؛ false = نسخهٔ بسته‌بندی‌شدهٔ آفلاین
titanali.remoteFirst=false
